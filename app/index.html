<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NOVAFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NOVAFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie eine Handy-App. Hauptmenü (Status, Start, Statistik) → aktives Training mit fester Leiste unten → Zusammenfassung */
:root{
  --bg:#f3f2f5;
  --surface:#ffffff;
  --ink:#1f1a24;
  --muted:#6e6676;
  --line:#e2dee7;
  --accent:#b0245a;
  --accent-soft:#f7e3eb;
  --run:#1f7a74;
  --run-soft:#ddf0ee;
  --good:#2f7d3b;
  --good-soft:#e2f2e4;
  --on-accent:#ffffff;
  --yoga:#6a52c9;
  --yoga-soft:#ebe7fa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131a;--surface:#221e27;--ink:#f1edf4;--muted:#a69daf;--line:#37313e;
    --accent:#ec6b9b;--accent-soft:#3b2130;--run:#5cc4bb;--run-soft:#1b3432;--good:#6cc77a;--good-soft:#1d3320;--on-accent:#23091a;--yoga:#a897f2;--yoga-soft:#29233f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131a;--surface:#221e27;--ink:#f1edf4;--muted:#a69daf;--line:#37313e;
  --accent:#ec6b9b;--accent-soft:#3b2130;--run:#5cc4bb;--run-soft:#1b3432;--good:#6cc77a;--good-soft:#1d3320;--on-accent:#23091a;--yoga:#a897f2;--yoga-soft:#29233f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 16px);display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{margin:0;font-size:13px;color:var(--muted)}
h1{font:700 34px/1 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2.sec{font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.topbtns{display:flex;gap:8px;flex-shrink:0}
.top h1{font-size:30px}
.seg.theme button[aria-pressed="true"]{color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 16px);padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Laufendes Training */
.resume{background:var(--accent);color:var(--on-accent);border:0;border-radius:calc(var(--rs) * 16px);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.resume b{display:block;font:700 22px/1.1 var(--display);text-transform:uppercase}
.resume span{font-size:13px;opacity:.9}
.resume .go{font:700 16px var(--display);text-transform:uppercase;background:rgba(255,255,255,.18);padding:8px 14px;border-radius:calc(var(--rs) * 999px);white-space:nowrap}

/* Wochenziel */
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:76px;height:76px}
.goal h3{margin:0;font:700 22px/1.1 var(--display);text-transform:uppercase}
.goal p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:calc(var(--rs) * 999px);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.run{background:var(--run-soft);color:var(--run)}
.pill.good{background:var(--good-soft);color:var(--good)}

/* Startkarten */
.starts{display:flex;flex-direction:column;gap:8px}
.start{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 16px);padding:12px 14px 12px 12px;cursor:pointer;text-align:left;width:100%}
.start .stripe{align-self:stretch;border-radius:calc(var(--rs) * 3px);background:var(--accent)}
.start[data-kind="run"] .stripe{background:var(--run)}
.start b{display:block;font:700 21px/1.1 var(--display);text-transform:uppercase}
.start small{display:block;color:var(--muted);font-size:13px}
.start .arrow{font:700 22px var(--display);color:var(--muted)}
.start.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.start.next[data-kind="run"]{border-color:var(--run);box-shadow:0 0 0 1px var(--run) inset}
.start .tag{display:inline-block;margin-left:6px;font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;color:var(--accent)}
.start[data-kind="run"] .tag{color:var(--run)}

/* Statistik */
.bigline{font:700 26px/1.1 var(--display);margin:0;text-transform:uppercase}
.bigline em{font-style:normal;color:var(--accent)}
.gain{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gain:first-of-type{border-top:0;padding-top:0}
.gain .n{font-weight:500}
.gain .v{font-size:13px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:calc(var(--rs) * 12px);padding:10px}
.tile small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.2}
.tile b{display:block;font:700 22px/1.15 var(--display);margin-top:4px;white-space:nowrap;font-size:clamp(17px,5.2vw,22px)}
.tile.run b{color:var(--run)}
.kcal{display:flex;align-items:baseline;gap:8px;margin:0;font-size:15px;flex-wrap:wrap}
.kcal b{font:700 22px var(--display);color:var(--accent)}
.kcal small{color:var(--muted);font-size:12px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:70px;position:relative}
.bars i{display:block;border-radius:calc(var(--rs) * 4px) calc(var(--rs) * 4px) calc(var(--rs) * 2px) calc(var(--rs) * 2px);background:var(--line);min-height:4px}
.bars i.hit{background:var(--accent)}
.bars i.now{outline:2px solid var(--accent);outline-offset:1px}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.hrow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dot.run{background:var(--run)}
.hrow b{font-weight:600}
.hrow small{display:block;color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;margin:0}

/* Training */
.sbar{position:sticky;top:0;z-index:5;margin:calc(-14px - env(safe-area-inset-top)) -16px 0;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sbar .ttl{text-align:center;flex:1}
.sbar .ttl b{display:block;font:700 20px/1 var(--display);text-transform:uppercase}
.sbar .ttl span{font-size:13px;color:var(--muted)}
.txtbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:8px 4px;min-width:64px;text-align:left}
.txtbtn.r{text-align:right;color:var(--muted);font-weight:500}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
/* Compact exercise card: picture, name and target in one line, everything else behind ⋯ */
.exh2{display:flex;align-items:center;gap:10px}
.exh2 .pic{width:44px;height:44px;flex:none;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.exh2 .pic img{width:100%;height:100%;object-fit:contain}
.exh2 .pic.lt{background:var(--bg);font:900 20px var(--display);color:var(--ink)}
.exh2 .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.exh2 .nm b{font-size:16px;font-weight:600;line-height:1.25}
.exh2 .nm small{font-size:12px;color:var(--muted)}
.exh2 .more{width:44px;height:44px;flex:none;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:0}
.exh2 .more:focus-visible,.exfold:focus-visible{outline:3px solid var(--run);outline-offset:2px}
.firsthint{font-size:13px;color:var(--muted);background:var(--bg);padding:6px 10px}
.exfold{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font-family:inherit;border-radius:calc(var(--rs) * 10px)}
.exfold .pic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.exfold .pic img{width:100%;height:100%;object-fit:contain}
.exfold .pic.lt{background:var(--bg);font:900 17px var(--display)}
.exfold span.t{flex:1;min-width:0;font-size:14px}
.exfold .ok{color:var(--good);font-size:12px;font-weight:800;letter-spacing:.08em}
.exmenu button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding-left:16px;padding-right:16px}
.exmenu button span{font-weight:400}
.exmenu .rm{color:var(--muted)}
.exhead h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.exhead h3 small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.target{flex-shrink:0;text-align:right}
.target b{display:block;font:700 19px/1.1 var(--display);color:var(--accent)}
.target span{font-size:12px;color:var(--muted)}
.cue{margin:0;font-size:13px;color:var(--muted)}
.lastl{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--good);background:var(--good-soft);padding:6px 10px;border-radius:calc(var(--rs) * 10px)}
.colhead,.setrow{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;align-items:center}
.colhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.setrow .sn{font:700 16px var(--display);color:var(--muted)}
.rmset{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.card.nudge{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.intro{margin:0;font-size:14px;padding:10px 12px;border-radius:calc(var(--rs) * 12px);background:var(--accent-soft);color:var(--ink)}
.field{position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:calc(var(--rs) * 12px);background:var(--bg);color:var(--ink);font:500 17px var(--body);padding:0 40px 0 12px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted);opacity:.55}
.field .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{width:44px;height:44px;border-radius:calc(var(--rs) * 12px);border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px;color:var(--muted)}
.setrow.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setrow.done .field input{border-color:var(--accent)}
.setrow.pre .field input{color:var(--muted)}
.keptl{margin:0 0 8px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--bg)}
.setrow .seterr{grid-column:1/-1;margin:-2px 0 4px;color:var(--hl,#ED1B34);font-size:13px;line-height:1.3}
.setrow .seterr:empty{display:none}
.setrow.bad .field input{border-color:var(--hl,#ED1B34)}
.setrow.shake .field:first-of-type input{border-color:var(--accent);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.addset{align-self:flex-start;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:1px dashed var(--line);border-radius:calc(var(--rs) * 12px);padding:10px 12px;color:var(--muted);font-size:13px;cursor:pointer;width:100%;text-align:left}
.optrow b{font-weight:500}
.card.opt{background:transparent;border-style:dashed}
.card.opt .target b{color:var(--muted)}
/* Choices in the settings (On/Off, Light/Dark, sex …): a black frame, the chosen one filled black (white in dark mode) */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ink);border:1.5px solid var(--ink);border-radius:0;padding:0;gap:1.5px}
.seg button{border:0;background:var(--surface);border-radius:0;padding:11px 8px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.rungrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.pace{display:flex;justify-content:space-between;align-items:center;background:var(--run-soft);border-radius:calc(var(--rs) * 12px);padding:10px 14px}
.pace b{font:700 26px/1 var(--display);color:var(--run)}
.pace span{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:calc(var(--rs) * 12px);background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding:10px 12px;resize:vertical}
.card.runcard{border-left:4px solid var(--run)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.bottombar .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.primary{width:100%;height:54px;border:0;border-radius:calc(var(--rs) * 16px);background:var(--accent);color:var(--on-accent);font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.primary.run{background:var(--run)}
:root[data-theme="dark"] .primary.run{color:#0b2422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary.run{color:#0b2422}}
.secondary{width:100%;height:48px;border:1px solid var(--line);border-radius:calc(var(--rs) * 14px);background:var(--surface);font-weight:600;cursor:pointer}
.danger{color:#b3261e}
.primary.sodel{background:#b3261e;color:#fff;border-color:#b3261e}
.rest{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:calc(var(--rs) * 14px);padding:10px 14px}
.rest b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;min-width:58px}
.rest .track{flex:1;height:6px;border-radius:calc(var(--rs) * 3px);background:rgba(127,127,127,.35);overflow:hidden}
.rest .track i{display:block;height:100%;background:var(--accent);width:100%}
.rest button{background:none;border:0;color:inherit;opacity:.8;cursor:pointer;font-size:13px}

/* Zusammenfassung */
.hero{text-align:left;padding:8px 0 0}
.hero h1{font-size:42px;transform-origin:left center}
.hero p{margin:6px 0 0;color:var(--muted)}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:calc(var(--rs) * 14px);background:var(--good-soft)}
.up.rec{box-shadow:0 0 0 2px var(--accent) inset}
.up.calm{background:var(--surface);border:1px solid var(--line)}
.uphead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.uphead b{font-weight:600;font-size:16px}
.recb{font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:3px 10px;border-radius:calc(var(--rs) * 999px);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font-size:14px;font-weight:600;color:var(--good);background:var(--surface);padding:4px 10px;border-radius:calc(var(--rs) * 999px);font-variant-numeric:tabular-nums}
.chip2 span{font-weight:400;color:var(--muted)}
.pop{animation:pop .75s cubic-bezier(.2,1.5,.4,1) both}
.fadeup{animation:fadeup .5s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-3deg)}100%{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}


/* Neue Bereiche: Diagramme, Abzeichen, Kalender, Ziele, Timer */
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:1fr 80px auto;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.exrow:first-child{border-top:0}
.exrow .n{font-weight:500}
.exrow .n small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.spark{width:80px;height:24px}
.chart{width:100%;height:auto;display:block}
.tbtn{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tbtn small::after{content:" ›"}
.goalbar{display:flex;flex-direction:column;gap:6px}
.goalbar .gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.goalbar .gl span{color:var(--muted)}
.goalbar .track,.tm .track{height:8px;border-radius:calc(var(--rs) * 4px);background:var(--line);overflow:hidden}
.goalbar .track i{display:block;height:100%;background:var(--run);border-radius:calc(var(--rs) * 4px)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;color:var(--muted)}
.badge .hx{width:60px;height:68px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;position:relative;background:var(--line)}
.badge .hx i{position:absolute;inset:5px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--bg)}
.badge .hx em{position:relative;z-index:1;font-style:normal;font-size:26px;filter:grayscale(1);opacity:.3}
.badge.got .hx{background:linear-gradient(160deg,#e0679b,#7a2a8f)}
.badge.got .hx i{background:linear-gradient(160deg,#c4306a,#7a2a8f)}
.badge.got.run .hx,.badge.got.run .hx i{background:linear-gradient(160deg,#239089,#155e75)}
.badge.got.yoga .hx,.badge.got.yoga .hx i{background:linear-gradient(160deg,#7a62d6,#4b3aa8)}
.badge.got .hx em{filter:none;opacity:1}
.badge.got .hx::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);pointer-events:none}
.badge.got small{font-weight:600}
.badge .bbar{width:44px;height:4px;border-radius:calc(var(--rs) * 2px);background:var(--line);overflow:hidden;margin-top:-2px}
.badge .bbar b{display:block;height:100%;background:var(--accent)}

[hidden]{display:none!important}
.phgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:calc(var(--rs) * 10px);overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
.nrc{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.nrc .secondary{width:100%}
.nrc .linkbtn{font-size:13px}
.guide code{font-size:12px;background:var(--bg);padding:1px 4px;border-radius:calc(var(--rs) * 4px)}
.sy-prog{display:flex;gap:4px;padding-right:96px}
.sy-snd{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:58px;border:0;background:rgba(255,255,255,.18);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.sy-prog i{flex:1;height:3px;border-radius:calc(var(--rs) * 2px);background:rgba(255,255,255,.3)}
.sy-prog i.done,.sy-prog i.on{background:#fff}
.sy-x{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:14px;border:0;background:rgba(255,255,255,.18);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.sy-in{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:520px;width:100%;margin:0 auto;padding:16px 0}
.sy-eb{margin:0;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.sy-big{margin:0;font:700 56px/1 var(--display);text-transform:uppercase;text-wrap:balance}
.sy-num{margin:0;font:700 96px/1 var(--display)}
.sy-p{margin:0;font-size:19px;line-height:1.4}
.sy-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 28px);left:0;right:0;text-align:center;font-size:13px;opacity:.7;margin:0}
.sy-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sy-list p{margin:0;font-size:17px;background:rgba(255,255,255,.14);border-radius:calc(var(--rs) * 14px);padding:10px 14px}
.sy-list p.sy-sm{background:none;padding:0;font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
.sy-pill{display:inline-block;background:#fff;color:#1f1a24;border-radius:calc(var(--rs) * 999px);padding:1px 8px;font-size:13px;font-weight:700;margin-left:4px}
.sy-bars{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.sbar2{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:15px}
.sbar2 .tr{display:block}
.sbar2 i{display:block;height:12px;border-radius:calc(var(--rs) * 6px);background:#fff}
.sbar2 b{text-align:right}
.sy-badges{background:rgba(255,255,255,.92);border-radius:calc(var(--rs) * 16px);padding:12px;color:#1f1a24}
.sy-of{font-size:.45em;opacity:.7;margin-left:4px}
.wdstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd .wdc{width:100%;aspect-ratio:1;max-width:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:18px;line-height:1}
.wd.on .wdc{background:#fff;border-color:#fff}
.wd.today .wdc{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.wd small{font-size:12px;opacity:.85}
.sy-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.sy-btn{height:52px;border:0;border-radius:calc(var(--rs) * 16px);background:#fff;color:#5a1438;font:700 19px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.sy-btn.ghost{background:rgba(255,255,255,.18);color:#fff}
/* Lauf schnell eintragen */
.runwrap{display:flex;flex-direction:column;gap:12px}
.wx1{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--run);background:var(--run-soft);border-radius:calc(var(--rs) * 14px);padding:9px 12px;font-weight:600}
.runroute{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 18px);padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
.runroute b{display:block;font:700 22px var(--display);text-transform:uppercase}
.runroute small{color:var(--muted);font-size:13px}
.runroute .lk{color:var(--run);font-weight:600;font-size:13px}
.runroute2{display:flex;flex-direction:column;gap:10px}
.runtime{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--run);border-radius:calc(var(--rs) * 22px);padding:14px 16px 16px;cursor:text}
.runtime small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.runtime input{width:100%;border:0;background:none;text-align:center;font:700 64px/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;padding:0;outline:none}
.runtime input::placeholder{color:var(--line)}
.runtime .ri{font-size:14px;color:var(--muted);text-align:center}
.runtime.shake{animation:sh .35s}
.runwin{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#2aa39a,#166b6a);color:#fff;border-radius:calc(var(--rs) * 16px);padding:12px 14px;font-size:14px;font-weight:600;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.runwin.soft{background:var(--run-soft);color:var(--run)}
.runwin span{font-size:22px}
.shotbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:calc(var(--rs) * 16px);padding:13px;background:var(--surface);cursor:pointer;text-align:left}
.shotbtn .ic{font-size:22px}.shotbtn b{display:block;font-size:15px}.shotbtn small{display:block;color:var(--muted);font-size:12px}
.runnote summary{list-style:none;color:var(--run);font-weight:600;font-size:14px;padding:2px 4px;cursor:pointer}
.runnote summary::-webkit-details-marker{display:none}
.runnote[open] summary{margin-bottom:8px}
/* Runs near you: built from the running menu rows (.start) and the yoga menu sections (.yhub-*) */
.nearsheet .nearsec{display:flex;flex-direction:column;gap:10px;padding-top:18px}
.nearsheet .nearsec h4{margin:2px 0 0}.nearsheet .nearsec .yhub-desc{margin:0 0 4px}
.nearrows{display:flex;flex-direction:column;gap:10px}
.nearrow{width:100%;font:inherit;color:inherit}
.nearrow .arrow{transition:transform .2s}.nearrow.open .arrow{transform:rotate(90deg)}
.nearrow.open{border-color:var(--run);box-shadow:0 0 0 1px var(--run) inset}
.nearfit{display:inline-block;margin-top:6px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--run);background:var(--run-soft);padding:3px 7px}
.nearpanel{display:flex;flex-direction:column;gap:10px;margin:-4px 0 2px;padding:12px 14px;border:1px solid var(--line);border-top:0;background:var(--surface)}
.nearpanel p{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.nearbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px}a.nearbtn{color:var(--ink)}
.flexsteps{font-size:14.5px}
.flexopts{display:flex;flex-direction:column;gap:6px}
.flexopt{position:relative;display:flex;align-items:center;height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:0 14px;cursor:pointer;overflow:hidden;text-align:left}
.flexopt i{position:absolute;left:0;top:0;bottom:0;background:var(--yoga-soft)}.flexopt span{position:relative}
.flexopt:hover,.flexopt:focus-visible{border-color:var(--yoga)}
.flexnow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.flexnow small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flexnow b{font:800 24px var(--num);color:var(--yoga)}
.flexchart{width:100%;height:auto;margin:6px 0}.flexchart path{fill:none;stroke:var(--yoga);stroke-width:3;stroke-linejoin:round}
.flexchart circle{fill:var(--surface);stroke:var(--yoga);stroke-width:3}.flexchart .toesline{stroke:var(--line);stroke-dasharray:4 4}
.flexchart text{font:600 11px var(--body);fill:var(--muted)}
.flexgo{margin-top:10px;width:100%}
.ynudge .primary{margin-top:10px}
.hsrcs{display:flex;flex-direction:column;gap:10px}
.hsrc{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:calc(var(--rs) * 16px);padding:12px 14px;background:var(--surface)}
.hsrc b{display:block;font-size:15px}.hsrc small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:8px}
.hpick{display:flex;align-items:center;justify-content:center;width:100%;cursor:pointer;margin-bottom:4px}
.hpick:focus-within{outline:2px solid var(--run);outline-offset:2px}
.hsteps{margin:0 0 4px;padding-left:18px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
.hsum{background:var(--run-soft);border-left:4px solid var(--run);padding:12px 14px;font-size:16px}
.hsum b{font-size:24px;color:var(--run)}.hsum small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.hsum.done{margin-bottom:14px}.hsum .txtbtn{padding:0;font-size:13px}
.hchk{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}.hchk input{width:20px;height:20px;accent-color:var(--run)}
.hskip{margin:0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.5}
.stlist{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border-top:1px solid var(--line)}
.strow{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.strow input{width:20px;height:20px;accent-color:var(--run);flex:none}
.strow b{display:block;font-size:15px}.strow small{display:block;font-size:12.5px;color:var(--muted)}
.filebtn{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--run);border-radius:calc(var(--rs) * 18px);padding:12px 14px;background:var(--surface);cursor:pointer}
.filebtn b{display:block;font-size:15px;color:var(--ink)}.filebtn small{display:block;color:var(--muted);font-size:12.5px}
.filebtn:focus-within{outline:2px solid var(--run);outline-offset:2px}
.filehelp ul{margin:0 0 6px;padding-left:18px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.shotok{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.shotok img{width:92px;max-height:190px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:calc(var(--rs) * 10px)}
.shotf{display:flex;flex-direction:column;gap:2px;min-width:0}
.shotf .field input{padding-right:12px}
.hint.warn{color:var(--ink);background:var(--accent-soft);border-left:3px solid var(--hl)}
.ocrwait{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 0}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--run-soft);border-top-color:var(--run);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lenseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lenseg button{border:1.5px solid var(--line);background:var(--surface);border-radius:calc(var(--rs) * 12px);padding:8px 0;font:600 14px var(--body);color:var(--ink);cursor:pointer}
.lenseg button.on{border-color:var(--yoga);background:var(--yoga-soft);color:var(--yoga)}
/* Lauf-Welt */
.rico{width:40px;height:40px;border-radius:calc(var(--rs) * 12px);display:grid;place-items:center;background:var(--run-soft);color:var(--run);flex:none}
.rico svg{width:22px;height:22px}
.rico.on{background:var(--run);color:#fff}
.start.goalc{border-color:var(--run);box-shadow:0 0 0 1px var(--run) inset}
.start.goalc b{color:var(--run)}
.start .gbar{display:block;height:5px;border-radius:calc(var(--rs) * 3px);background:var(--line);margin-top:8px;overflow:hidden}
.start .gbar i{display:block;height:100%;background:var(--run);border-radius:calc(var(--rs) * 3px)}
.plantoday{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--run);border-radius:calc(var(--rs) * 16px);padding:11px 14px}
.plantoday small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plantoday b{display:block;font:700 19px/1.15 var(--display);text-transform:uppercase}
.plantoday span:not(.rico){display:block;font-size:12.5px;color:var(--muted)}
.shotcta{display:flex;align-items:center;justify-content:center;gap:12px;height:64px;border-radius:calc(var(--rs) * 18px);background:var(--run);color:#fff;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;box-shadow:0 10px 22px -12px rgba(35,144,137,.9)}
.shotcta .rico{background:rgba(255,255,255,.18);color:#fff;width:36px;height:36px}
.orline{display:flex;align-items:center;gap:10px;margin:2px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
.runkm{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 18px);padding:12px 16px}
.runkm small,.runlead{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.runerr{color:var(--hl,#ED1B34);font-size:13px;line-height:1.3;margin:-4px 0 6px}
.runerr:empty{display:none}
.runkm:has([aria-invalid="true"]),.runtime:has([aria-invalid="true"]){border-color:var(--hl,#ED1B34)}
.runlead{letter-spacing:0;text-transform:none;font-weight:400;font-size:14px}
.runkm > span{display:flex;align-items:baseline;gap:6px}
.runkm input{flex:1;min-width:0;border:0;background:none;font:700 34px var(--display);color:var(--ink);padding:0;outline:none}
.runkm input::placeholder{color:var(--line)}
.runkm em{font-style:normal;color:var(--muted);font-weight:600}
.kmchip{align-self:flex-start;border:1px solid var(--run);background:var(--run-soft);color:var(--run);border-radius:calc(var(--rs) * 999px);padding:5px 11px;font:600 12.5px var(--body);cursor:pointer}
.runwin .rico{background:rgba(255,255,255,.2);color:#fff;width:34px;height:34px}
.runwin.soft .rico{background:var(--surface);color:var(--run)}
.runwin + .runwin{margin-top:8px}
.plw,.plview{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.plsteps{display:flex;gap:6px}.plsteps i{flex:1;height:4px;border-radius:calc(var(--rs) * 2px);background:var(--line)}.plsteps i.on{background:var(--run)}
.plh{margin:6px 0 0;font:700 32px/1 var(--display);text-transform:uppercase}
.goalopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 18px);padding:14px;font:inherit;color:var(--ink);cursor:pointer}
.goalopt b{display:block;font-size:16px}.goalopt small{display:block;color:var(--muted);font-size:13px}
.goalopt .arrow{margin-left:auto;font:700 22px var(--display);color:var(--muted)}
.plg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plf{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 16px);padding:10px 12px}
.plf small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plf input{border:0;background:none;font:700 26px var(--display);color:var(--ink);padding:0;outline:none;min-width:0;width:100%}
.plf input[type=date]{font-size:20px;min-height:34px}
.plinfo{margin:0;background:var(--run-soft);border-radius:calc(var(--rs) * 14px);padding:11px 13px;font-size:13.5px;color:var(--ink);line-height:1.45}
.plinfo.sm{background:none;padding:0 2px;font-size:12.5px;color:var(--muted)}
.plwarn{margin:0;background:var(--accent-soft);color:var(--accent);border-radius:calc(var(--rs) * 14px);padding:10px 12px;font-size:13px;font-weight:600}
.plq{margin:4px 0 -4px;font-weight:600;font-size:15px}
.plseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plseg button,.pldays button{border:1.5px solid var(--line);background:var(--surface);border-radius:calc(var(--rs) * 14px);padding:10px 0;font:inherit;color:var(--ink);cursor:pointer}
.plseg button b{display:block;font:700 22px var(--display)}.plseg button small{font-size:11px;color:var(--muted)}
.plseg button.on,.pldays button.on{border-color:var(--run);background:var(--run-soft);color:var(--run)}
.pldays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pldays button{padding:9px 0;font-weight:700;font-size:13px}
.pldays button.gym:not(.on){color:var(--muted);background:var(--bg)}
.planhd{border-radius:calc(var(--rs) * 22px);padding:16px 16px 12px;color:#fff;background:linear-gradient(135deg,#2aa39a,#155e75);box-shadow:0 10px 26px -14px rgba(21,94,117,.8)}
.planhd small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:600}
.planhd h2{margin:4px 0;font:700 30px/1 var(--display);text-transform:uppercase}
.planhd p{margin:0;font-size:13px;opacity:.95}
.pbars{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:12px}
.pbars i{flex:1;border-radius:calc(var(--rs) * 4px) calc(var(--rs) * 4px) calc(var(--rs) * 2px) calc(var(--rs) * 2px);background:rgba(255,255,255,.28)}
.pbars i.d{background:rgba(255,255,255,.95)}.pbars i.c{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.pfoot{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin-top:8px}
.plan-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:12px;opacity:.9;margin-top:8px}
.rweek{display:flex;flex-direction:column}
.rweek h3{margin:0 0 6px;font:700 22px/1.15 var(--display);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rweek h3 span{font:600 12px var(--body);color:var(--muted);text-transform:none}
.rweek.dim{opacity:.7}
.prun{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rweek h3 + .prun{border-top:0}
.prun b{display:block;font-size:15px}.prun small{display:block;font-size:12.5px;color:var(--muted)}
.prun em{font-style:normal;font-size:12px;font-weight:700;color:var(--run);white-space:nowrap}
.prun em.rnext{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--surface);padding:3px 7px}
.prun.next{background:var(--run-soft);margin:0 -10px;padding:10px;border-radius:calc(var(--rs) * 14px);border-top:0}
.prun.next + .prun{border-top:0}
.prun.miss em{color:var(--muted)}
.plall{align-self:center;color:var(--run)!important}
/* Story: Grafiken auf Fotos */
.has-photo .sy-panel{background:rgba(25,12,30,.42);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.14)}
.has-photo .mcmp p{background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.has-photo .mrk,.has-photo .mhint,.has-photo .msm{text-shadow:0 1px 6px rgba(0,0,0,.45)}
.has-photo .mhint{background:rgba(0,0,0,.32)}

.story.s8{background:linear-gradient(160deg,#c4306a,#5a1438)}
.sy-panel{background:rgba(255,255,255,.13);border-radius:calc(var(--rs) * 18px);padding:12px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}

.mbars{position:relative;display:flex;align-items:flex-end;gap:10px;padding-top:6px}

/* ================= NOVAFit · Nova SBE Design ================= */
:root{--rs:0;--display:"Playfair Display",Georgia,"Times New Roman",serif;--body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--num:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#ffffff;--surface:#ffffff;--ink:#000000;--muted:#4a4a4a;--line:#e3e3e5;--accent:#000000;--accent-soft:#f2f2f2;--run:#005BAA;--run-soft:#e6eff8;--good:#1e7b3a;--good-soft:#e5f3e9;--on-accent:#ffffff;--yoga:#FC4C01;--yoga-soft:#fff0e8;--bar:#000000;--hl:#ED1B34;--hero:#000000;--hero-run:#000000;--hero-yoga:#000000;--hero-gold:#000000;--hero-btn:#000000;--g1:0,0,0;--g2:0,0,0;--deep:#2b2b2b;color-scheme:light;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#121212;--ink:#ffffff;--muted:#a6a6a6;--line:#2b2b2b;--accent:#ffffff;--accent-soft:#1f1f1f;--run:#4d9be6;--run-soft:#0d2236;--good:#5cc77a;--good-soft:#12301c;--on-accent:#000000;--yoga:#ff7a3d;--yoga-soft:#2e1608;--bar:#ffffff;--hl:#ff4458;--hero:#161616;--hero-run:#161616;--hero-yoga:#161616;--hero-gold:#161616;--hero-btn:#000000;--deep:#d0d0d0;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#000000;--surface:#121212;--ink:#ffffff;--muted:#a6a6a6;--line:#2b2b2b;--accent:#ffffff;--accent-soft:#1f1f1f;--run:#4d9be6;--run-soft:#0d2236;--good:#5cc77a;--good-soft:#12301c;--on-accent:#000000;--yoga:#ff7a3d;--yoga-soft:#2e1608;--bar:#ffffff;--hl:#ff4458;--hero:#161616;--hero-run:#161616;--hero-yoga:#161616;--hero-gold:#161616;--hero-btn:#000000;--deep:#d0d0d0;color-scheme:dark;}
/* Ueberschriften: Serif, normale Schreibweise */
h1,.goal h3,.start b,.resume b,.bigline,.sbar .ttl b,.calhead b,.sheet h3,.hero h2,.runroute b,.plantoday b,.plh,.planhd h2,.rweek h3,.sy-big,.tmphase{text-transform:none;letter-spacing:0}
.start b{font-size:22px}
/* Zahlen + Buttons: Open Sans */
.tile b,.kcal b,.target b,.setrow .sn,.pace b,.rest b,.stepper b,.tmtime,.sy-num,.runtime input,.runkm input,.plf input,.plseg button b,.mb em,.mcmp b,.mrk b,.start .arrow,.goalopt .arrow{font-family:var(--num);font-weight:800;letter-spacing:-.01em}
.primary,.resume .go,.recb,.sy-btn,.shotcta,.tmtop{font-family:var(--num);font-weight:700;letter-spacing:.1em}
.primary,.sy-btn,.shotcta{font-size:15px}
.bottombar .primary[data-act=finish]{font-size:15px}
.ring text{font-family:var(--num)!important;font-weight:800;font-size:19px}
/* Abschnittstitel mit Nova-Balken */
h2.sec{font:700 22px/1.15 var(--display);letter-spacing:0;text-transform:none;color:var(--ink);margin:6px 0 14px}
h2.sec::after{content:"";display:block;width:36px;height:6px;margin-top:9px;background:var(--bar)}
/* Marke */
.brand{font:700 22px/1 var(--display);text-transform:none;letter-spacing:0;gap:10px}
.brand img{display:none}
.brand .nfm{width:30px;height:30px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:800 17px/1 var(--num);border-radius:calc(var(--rs) * 8px)}
.brand .nfw b{font:800 19px/1 var(--num);letter-spacing:.06em}
.brand .nfw i{font:italic 700 22px/1 var(--display);color:var(--bar);margin-left:1px}
.start .tag{color:var(--hl)}
.start[data-kind="run"] .tag{color:var(--hl)}
/* Hero */
.hero{background:var(--hero);box-shadow:none}
.hero.run{background:var(--hero-run);box-shadow:none}
.hero.yoga{background:var(--hero-yoga);box-shadow:none}
.hero.gold{background:var(--hero-gold);box-shadow:none}
.hero.photo,.hero.photo.run,.hero.photo.yoga,.hero.photo.gold{box-shadow:none}
.hero::after{background:none;border:28px solid rgba(255,255,255,.1);width:210px;height:210px;right:-70px;top:-80px}
.hero h2{font-size:36px;line-height:1.05}
.herobtn,.hero.photo .herobtn{color:var(--hero-btn)}
.hero.run .herobtn{color:var(--run)}.hero.yoga .herobtn{color:var(--yoga)}
.resume{box-shadow:none}
.bigline em{font-family:var(--num);font-weight:800;white-space:nowrap;font-size:.9em}
/* Abzeichen flach in Markenfarben */
.badge.got .hx{background:var(--accent)}
.badge.got .hx i{background:var(--deep)}
.badge.got.run .hx,.badge.got.run .hx i{background:var(--run)}
.badge.got.yoga .hx,.badge.got.yoga .hx i{background:var(--yoga)}
.card,.start{border-color:var(--line)}.hero .herobtn{color:var(--hero-btn)!important}
/* NOVAFit: Timer, Rueckblicke, Laufplan in Nova-Farben */
.primary.yoga{background:var(--yoga);color:#fff}
#timerlayer.fast{background:var(--hl);color:#fff}
#timerlayer.yoga{background:var(--yoga);color:#fff}
.resume.yearcard{background:var(--ink);color:var(--bg)}
.resume.yearcard .go{background:var(--hl);color:#fff}
.story{background:#000}
/* Reviews: one neutral look on every slide; the photo (yours or the Nova pack) carries the colour */
.story.s1,.story.s2,.story.s3,.story.s4,.story.s5,.story.s6,.story.s7,.story.s8{background:#141414}
.has-photo .sy-tint{background:#000;opacity:.34}
.has-photo .sy-panel{background:rgba(0,0,0,.48)}
.sy-goalbar{height:8px;background:rgba(255,255,255,.25)}.sy-goalbar i{display:block;height:8px;background:#fff}
.has-photo .sy-panel{background:rgba(0,0,0,.45)}
.sy-big{font-family:var(--display);text-transform:none;letter-spacing:0}
.sy-btn{color:#000}
.sy-pill,.sy-badges{color:#000}
.mcal span.on{color:#000}.mcal span.on.run{background:#9cc6f0;color:#002f5c}.mcal span.on.yoga{background:#ffc3a3;color:#7a2600}
.mleg i.run{background:#9cc6f0}.mleg i.yoga{background:#ffc3a3}
.mb em{color:#000}
.runwin{background:var(--run)}
.planhd{background:#005BAA;box-shadow:none}
/* ===== NOVAFit-Header: weiß, schwarze Wortmarke, an die Scrollposition gekoppelt ===== */
:root{--nf-hmax:104px;--nf-hmin:56px;--nf-lmax:34;--nf-lmin:21;--nf-pad:16px}
@media (min-width:600px){:root{--nf-hmax:124px;--nf-hmin:64px;--nf-lmax:38;--nf-lmin:24;--nf-pad:28px}}
@media (min-width:1024px){:root{--nf-hmax:144px;--nf-hmin:68px;--nf-lmax:42;--nf-lmin:26;--nf-pad:40px}}
@media (max-height:520px) and (orientation:landscape){:root{--nf-hmax:76px;--nf-hmin:52px;--nf-lmax:26;--nf-lmin:20}}
@media (prefers-reduced-motion: reduce){:root:root{--nf-hmax:var(--nf-hmin)}}
.nf{position:sticky;z-index:8;flex-shrink:0;top:calc(var(--nf-hmin) - var(--nf-hmax));height:calc(env(safe-area-inset-top) + var(--nf-hmax));
  margin:calc(-14px - env(safe-area-inset-top)) calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
  background:#fff;color:#000;box-shadow:0 0 0 100vmax #fff,0 1px 0 100vmax #e6e4e8;clip-path:inset(0 -100vmax -1px)}
.nf-in{position:absolute;top:0;bottom:0;left:0;right:0;max-width:1180px;margin:0 auto;
  padding:0 calc(env(safe-area-inset-right) + var(--nf-pad)) 0 calc(env(safe-area-inset-left) + var(--nf-pad))}
.nf-mark{position:absolute;left:0;top:0;width:0;height:0;color:#000}
.nf-mark > *{position:absolute;left:0;top:0;display:block;transform-origin:0 0;fill:currentColor}
.nf-n{width:80px;height:100px}.nf-rest{width:285px;height:100px}.nf-o{width:80px;height:80px}
.nf-bar{width:100px;height:22px;background:currentColor}
.nf:not(.nf-on) .nf-mark{visibility:hidden}
.nf-btns{position:absolute;right:calc(env(safe-area-inset-right) + var(--nf-pad));top:calc(env(safe-area-inset-top) + var(--nf-hmax) / 2 - 21px)}
.nf .iconbtn{background:#fff;border-color:#dedbe2;color:#111}
.nf .iconbtn:hover{border-color:#111}
/* ===== v2.2 Nova-Design: Fotos, Karten mit Bild, Farbblöcke, Menü, Footer ===== */
.nf .iconbtn.hb{border:0;border-radius:0;background:none;width:46px;color:#000}
.nf .iconbtn.hb svg{width:30px;height:24px}
/* ===== Layout A: Today · Train · Progress tabs, "You" page ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabbar button{flex:1;max-width:186px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:7px 0 6px;border:0;border-top:3px solid transparent;background:none;color:var(--muted);font:600 11px var(--num);cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:800;border-top-color:var(--ink)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button:focus-visible{outline:3px solid var(--run);outline-offset:-3px}
.app:has(.tabbar) .pfoot{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.app:has(.tabbar) ~ .toast,.app:has(.tabbar) .toast{bottom:calc(env(safe-area-inset-bottom) + 84px)}
.counters{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:0 -4px}
.ctr{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:0 10px;border:0;border-left:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit}
.ctr:first-child{border-left:0}
button.ctr{cursor:pointer}
.ctr b{font:900 28px/1.1 var(--display)}
.ctr span{font-size:11px;line-height:1.3;color:var(--muted)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead .more{border:0;background:none;color:var(--ink);font:800 11px var(--num);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:8px 0;min-height:44px}
.ntiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ntile,.ttile{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer;min-width:0}
.ntile img,.ttile img{width:100%;height:92px;object-fit:cover;display:block;background:var(--line)}
.ttile img{height:108px}
.nmeta{display:flex;justify-content:space-between;gap:6px;font:800 10px var(--num);letter-spacing:.14em;text-transform:uppercase;color:var(--run)}
.nmeta span+span{color:var(--muted)}
.nmeta .up{color:var(--hl, var(--run))}
.ntile b,.ttile b{font-size:14px;line-height:1.3}
.ttile b{font-size:16px}
.ttile small{font-size:12px;color:var(--muted)}
.ttile .go{font:800 10px var(--num);letter-spacing:.14em;text-transform:uppercase}
.ttiles{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.tlinks{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.newsec{margin-top:26px}
.newsec > .eyebrow{margin:0 0 6px;font:800 11px var(--num);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.newsec a.more{text-decoration:none;color:var(--ink)}
.newslist{border-top:1px solid var(--line);margin-top:10px}
.newsrow{display:flex;align-items:flex-start;gap:12px;min-height:48px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.newsrow b{flex:1;font-size:15px;line-height:1.35;font-weight:700}
.newsrow svg{flex:none;margin-top:3px;color:var(--muted)}
.newsrow:focus-visible{outline:3px solid var(--run);outline-offset:2px}
.newsnote{margin:8px 0 0;font-size:11px}
/* Train: today, week in words, one picture per sport */
.trhead{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0 12px}
.trhead h1{margin:0;font:900 30px var(--display)}
.trhead span{font-size:12px;color:var(--muted)}
.trhead b{color:var(--ink)}
.trrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:12px 14px;border-left:5px solid var(--kc,var(--ink));background:color-mix(in srgb,var(--ink) 5%,transparent)}
.trrow > span{display:flex;flex-direction:column;gap:1px;min-width:0}
.trrow small{font:800 11px var(--num);letter-spacing:.16em;text-transform:uppercase;color:var(--kc,var(--muted))}
.trrow b{font-size:16px;font-weight:700}
.trrow em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstart{flex:none;min-height:42px;padding:0 14px;border:0;background:var(--ink);color:var(--bg);font:800 11px var(--num);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.trline{display:flex;list-style:none;margin:0;padding:0;gap:2px}
.trline li{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 0;border-top:3px solid var(--kc,var(--line))}
.trline li.off{border-top-color:var(--line)}
.trline li.plan,.trline li.open{border-top-style:solid;opacity:1}
.trline li.plan{border-top-color:color-mix(in srgb,var(--kc) 35%,transparent)}
.trline li small{font:800 10px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trline li b{font-size:11px;letter-spacing:-.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trline li.done b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.trline li.off b{color:var(--muted);font-weight:500}
.trline li.today{border-top-width:5px;padding-top:5px}
.trline li.today small,.trline li.today b{color:var(--ink)}
.trline li.open b::after{content:" ·";color:var(--kc)}
.tsports{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.tsport{position:relative;display:block;width:100%;height:108px;padding:0;border:0;overflow:hidden;background:#111;color:#fff;text-align:left;cursor:pointer}
.tsports.one .tsport{height:200px}
.tsport img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tsport::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to right,rgba(10,10,14,.78),rgba(10,10,14,.15) 70%)}
.tsport::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;z-index:2;background:var(--kc)}
.k-s{--kc:#4b1a63}.k-r{--kc:#005BAA}.k-y{--kc:#b83c00}
.ts-txt{position:absolute;left:20px;right:44px;top:0;bottom:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px}
.ts-txt b{font:700 26px/1.05 var(--display)}
.ts-txt small{font-size:12px;opacity:.92}
.ts-today{margin-top:4px;background:#fff;color:#111;font:800 9px var(--num);letter-spacing:.14em;text-transform:uppercase;padding:3px 6px}
.ts-go{position:absolute;right:16px;bottom:12px;z-index:2;font-size:24px}
.tsport:focus-visible{outline:3px solid var(--run);outline-offset:2px}
/* Gym page */
.sphead{position:relative;width:100%;height:170px;overflow:hidden;background:#111;color:#fff}
.sphead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sphead::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(10,10,14,.88) 0%,rgba(10,10,14,.45) 45%,rgba(10,10,14,.2) 100%)}
.sphead::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;z-index:2;background:var(--kc)}
.spback{position:absolute;left:12px;top:max(10px, env(safe-area-inset-top));z-index:2;min-height:44px;padding:0 8px;border:0;background:none;color:#fff;font:700 14px var(--body);cursor:pointer}
.sphead > div{position:absolute;left:20px;right:20px;bottom:14px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sphead small{font:800 11px var(--num);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.sphead h1{margin:2px 0;font:700 30px var(--display);color:#fff}
.sphead p{margin:0;font-size:12px;opacity:.9}
.spbody{width:100%;box-sizing:border-box;padding:14px 20px 120px;max-width:640px;margin:0 auto}
.spnext{display:flex;flex-direction:column;gap:6px;padding:14px;border:1.5px solid var(--kc,#4b1a63);--kc:#4b1a63}
.spnext small{font:800 11px var(--num);letter-spacing:.16em;text-transform:uppercase;color:var(--kc)}
.spnext b{font:700 22px var(--display)}
.spnext p{margin:0;font-size:13px;color:var(--muted)}
.spbody .trline{margin-top:14px}
.spsec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px;font:800 11px var(--num);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.spsec span + span{font:400 12px var(--body);letter-spacing:0;text-transform:none}
.sprow b.dim{color:var(--muted)}
.sptag{font:800 9px var(--num);letter-spacing:.14em;text-transform:uppercase;background:var(--kc);color:#fff;padding:3px 6px}
.spdone{display:flex;color:var(--muted)}
.splog{display:flex;gap:8px}
.splog button{flex:1;min-height:76px;padding:12px;border:1.5px solid #005BAA;background:var(--bg);color:var(--ink);text-align:left;display:flex;flex-direction:column;justify-content:space-between;font:15px var(--body);cursor:pointer}

.splog small{font-size:11px;opacity:.85}
.spgoal{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:15px var(--body);cursor:pointer}
.spgoal > span{display:flex;justify-content:space-between;align-items:baseline}
