<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NOVAFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NOVAFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie eine Handy-App. Hauptmenü (Status, Start, Statistik) → aktives Training mit fester Leiste unten → Zusammenfassung */
:root{
  --bg:#f3f2f5;
  --surface:#ffffff;
  --ink:#1f1a24;
  --muted:#6e6676;
  --line:#e2dee7;
  --accent:#b0245a;
  --accent-soft:#f7e3eb;
  --run:#1f7a74;
  --run-soft:#ddf0ee;
  --good:#2f7d3b;
  --good-soft:#e2f2e4;
  --on-accent:#ffffff;
  --yoga:#6a52c9;
  --yoga-soft:#ebe7fa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131a;--surface:#221e27;--ink:#f1edf4;--muted:#a69daf;--line:#37313e;
    --accent:#ec6b9b;--accent-soft:#3b2130;--run:#5cc4bb;--run-soft:#1b3432;--good:#6cc77a;--good-soft:#1d3320;--on-accent:#23091a;--yoga:#a897f2;--yoga-soft:#29233f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131a;--surface:#221e27;--ink:#f1edf4;--muted:#a69daf;--line:#37313e;
  --accent:#ec6b9b;--accent-soft:#3b2130;--run:#5cc4bb;--run-soft:#1b3432;--good:#6cc77a;--good-soft:#1d3320;--on-accent:#23091a;--yoga:#a897f2;--yoga-soft:#29233f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 110px) calc(env(safe-area-inset-left) + 16px);display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{margin:0;font-size:13px;color:var(--muted)}
h1{font:700 34px/1 var(--display);margin:2px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2.sec{font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.topbtns{display:flex;gap:8px;flex-shrink:0}
.top h1{font-size:30px}
.seg.theme button[aria-pressed="true"]{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 16px);padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Laufendes Training */
.resume{background:var(--accent);color:var(--on-accent);border:0;border-radius:calc(var(--rs) * 16px);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.resume b{display:block;font:700 22px/1.1 var(--display);text-transform:uppercase}
.resume span{font-size:13px;opacity:.9}
.resume .go{font:700 16px var(--display);text-transform:uppercase;background:rgba(255,255,255,.18);padding:8px 14px;border-radius:calc(var(--rs) * 999px);white-space:nowrap}

/* Wochenziel */
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:76px;height:76px}
.goal h3{margin:0;font:700 22px/1.1 var(--display);text-transform:uppercase}
.goal p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:calc(var(--rs) * 999px);background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.run{background:var(--run-soft);color:var(--run)}
.pill.good{background:var(--good-soft);color:var(--good)}

/* Startkarten */
.starts{display:flex;flex-direction:column;gap:8px}
.start{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 16px);padding:12px 14px 12px 12px;cursor:pointer;text-align:left;width:100%}
.start .stripe{align-self:stretch;border-radius:calc(var(--rs) * 3px);background:var(--accent)}
.start[data-kind="run"] .stripe{background:var(--run)}
.start b{display:block;font:700 21px/1.1 var(--display);text-transform:uppercase}
.start small{display:block;color:var(--muted);font-size:13px}
.start .arrow{font:700 22px var(--display);color:var(--muted)}
.start.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.start.next[data-kind="run"]{border-color:var(--run);box-shadow:0 0 0 1px var(--run) inset}
.start .tag{display:inline-block;margin-left:6px;font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;color:var(--accent)}
.start[data-kind="run"] .tag{color:var(--run)}

/* Statistik */
.bigline{font:700 26px/1.1 var(--display);margin:0;text-transform:uppercase}
.bigline em{font-style:normal;color:var(--accent)}
.gain{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gain:first-of-type{border-top:0;padding-top:0}
.gain .n{font-weight:500}
.gain .v{font-size:13px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:calc(var(--rs) * 12px);padding:10px}
.tile small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.2}
.tile b{display:block;font:700 22px/1.15 var(--display);margin-top:4px;white-space:nowrap;font-size:clamp(17px,5.2vw,22px)}
.tile.run b{color:var(--run)}
.kcal{display:flex;align-items:baseline;gap:8px;margin:0;font-size:15px;flex-wrap:wrap}
.kcal b{font:700 22px var(--display);color:var(--accent)}
.kcal small{color:var(--muted);font-size:12px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:70px;position:relative}
.bars i{display:block;border-radius:calc(var(--rs) * 4px) calc(var(--rs) * 4px) calc(var(--rs) * 2px) calc(var(--rs) * 2px);background:var(--line);min-height:4px}
.bars i.hit{background:var(--accent)}
.bars i.now{outline:2px solid var(--accent);outline-offset:1px}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%}
.hrow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.dot.run{background:var(--run)}
.hrow b{font-weight:600}
.hrow small{display:block;color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;margin:0}

/* Training */
.sbar{position:sticky;top:0;z-index:5;margin:calc(-14px - env(safe-area-inset-top)) -16px 0;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sbar .ttl{text-align:center;flex:1}
.sbar .ttl b{display:block;font:700 20px/1 var(--display);text-transform:uppercase}
.sbar .ttl span{font-size:13px;color:var(--muted)}
.txtbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:8px 4px;min-width:64px;text-align:left}
.txtbtn.r{text-align:right;color:var(--muted);font-weight:500}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.exhead h3 small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.target{flex-shrink:0;text-align:right}
.target b{display:block;font:700 19px/1.1 var(--display);color:var(--accent)}
.target span{font-size:12px;color:var(--muted)}
.cue{margin:0;font-size:13px;color:var(--muted)}
.lastl{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--good);background:var(--good-soft);padding:6px 10px;border-radius:calc(var(--rs) * 10px)}
.colhead,.setrow{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;align-items:center}
.colhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.setrow .sn{font:700 16px var(--display);color:var(--muted)}
.rmset{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.card.nudge{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.intro{margin:0;font-size:14px;padding:10px 12px;border-radius:calc(var(--rs) * 12px);background:var(--accent-soft);color:var(--ink)}
.field{position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:calc(var(--rs) * 12px);background:var(--bg);color:var(--ink);font:500 17px var(--body);padding:0 40px 0 12px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--muted);opacity:.55}
.field .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{width:44px;height:44px;border-radius:calc(var(--rs) * 12px);border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:18px;color:var(--muted)}
.setrow.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setrow.done .field input{border-color:var(--accent)}
.setrow.pre .field input{color:var(--muted)}
.setrow.shake .field:first-of-type input{border-color:var(--accent);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.addset{align-self:flex-start;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:1px dashed var(--line);border-radius:calc(var(--rs) * 12px);padding:10px 12px;color:var(--muted);font-size:13px;cursor:pointer;width:100%;text-align:left}
.optrow b{font-weight:500}
.card.opt{background:transparent;border-style:dashed}
.card.opt .target b{color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:calc(var(--rs) * 12px);padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:calc(var(--rs) * 9px);padding:10px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--run);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rungrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.pace{display:flex;justify-content:space-between;align-items:center;background:var(--run-soft);border-radius:calc(var(--rs) * 12px);padding:10px 14px}
.pace b{font:700 26px/1 var(--display);color:var(--run)}
.pace span{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:calc(var(--rs) * 12px);background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding:10px 12px;resize:vertical}
.card.runcard{border-left:4px solid var(--run)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.bottombar .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.primary{width:100%;height:54px;border:0;border-radius:calc(var(--rs) * 16px);background:var(--accent);color:var(--on-accent);font:700 20px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.primary.run{background:var(--run)}
:root[data-theme="dark"] .primary.run{color:#0b2422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary.run{color:#0b2422}}
.secondary{width:100%;height:48px;border:1px solid var(--line);border-radius:calc(var(--rs) * 14px);background:var(--surface);font-weight:600;cursor:pointer}
.danger{color:#b3261e}
.rest{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:calc(var(--rs) * 14px);padding:10px 14px}
.rest b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums;min-width:58px}
.rest .track{flex:1;height:6px;border-radius:calc(var(--rs) * 3px);background:rgba(127,127,127,.35);overflow:hidden}
.rest .track i{display:block;height:100%;background:var(--accent);width:100%}
.rest button{background:none;border:0;color:inherit;opacity:.8;cursor:pointer;font-size:13px}

/* Zusammenfassung */
.hero{text-align:left;padding:8px 0 0}
.hero h1{font-size:42px;transform-origin:left center}
.hero p{margin:6px 0 0;color:var(--muted)}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:calc(var(--rs) * 14px);background:var(--good-soft)}
.up.rec{box-shadow:0 0 0 2px var(--accent) inset}
.up.calm{background:var(--surface);border:1px solid var(--line)}
.uphead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.uphead b{font-weight:600;font-size:16px}
.recb{font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:3px 10px;border-radius:calc(var(--rs) * 999px);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font-size:14px;font-weight:600;color:var(--good);background:var(--surface);padding:4px 10px;border-radius:calc(var(--rs) * 999px);font-variant-numeric:tabular-nums}
.chip2 span{font-weight:400;color:var(--muted)}
.pop{animation:pop .75s cubic-bezier(.2,1.5,.4,1) both}
.fadeup{animation:fadeup .5s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-3deg)}100%{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}


/* Neue Bereiche: Diagramme, Abzeichen, Kalender, Ziele, Timer */
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:1fr 80px auto;gap:12px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.exrow:first-child{border-top:0}
.exrow .n{font-weight:500}
.exrow .n small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.spark{width:80px;height:24px}
.chart{width:100%;height:auto;display:block}
.tbtn{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tbtn small::after{content:" ›"}
.goalbar{display:flex;flex-direction:column;gap:6px}
.goalbar .gl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.goalbar .gl span{color:var(--muted)}
.goalbar .track,.tm .track{height:8px;border-radius:calc(var(--rs) * 4px);background:var(--line);overflow:hidden}
.goalbar .track i{display:block;height:100%;background:var(--run);border-radius:calc(var(--rs) * 4px)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;color:var(--muted)}
.badge .hx{width:60px;height:68px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;position:relative;background:var(--line)}
.badge .hx i{position:absolute;inset:5px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--bg)}
.badge .hx em{position:relative;z-index:1;font-style:normal;font-size:26px;filter:grayscale(1);opacity:.3}
.badge.got .hx{background:linear-gradient(160deg,#e0679b,#7a2a8f)}
.badge.got .hx i{background:linear-gradient(160deg,#c4306a,#7a2a8f)}
.badge.got.run .hx,.badge.got.run .hx i{background:linear-gradient(160deg,#239089,#155e75)}
.badge.got.yoga .hx,.badge.got.yoga .hx i{background:linear-gradient(160deg,#7a62d6,#4b3aa8)}
.badge.got .hx em{filter:none;opacity:1}
.badge.got .hx::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);pointer-events:none}
.badge.got small{font-weight:600}
.badge .bbar{width:44px;height:4px;border-radius:calc(var(--rs) * 2px);background:var(--line);overflow:hidden;margin-top:-2px}
.badge .bbar b{display:block;height:100%;background:var(--accent)}
.nextb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--accent-soft);border:0;border-radius:calc(var(--rs) * 16px);padding:12px 14px;margin-bottom:16px;color:var(--ink);font:inherit;cursor:pointer}
.nextb .e{font-size:28px}
.nextb .nb-t{flex:1;display:flex;flex-direction:column;gap:2px}
.nextb b{font-size:15px}
.nextb .nb-t > span:not(.bar2){font-size:13px;color:var(--muted)}
.nextb .bar2{height:6px;border-radius:calc(var(--rs) * 3px);background:rgba(127,127,127,.2);margin-top:6px;overflow:hidden}
.nextb .bar2 i{display:block;height:100%;background:var(--accent)}
.badge small{font-size:11px;line-height:1.2;text-align:center}
.badge.got{color:var(--ink)}
.badge.sm .hx{width:54px;height:61px}
.newbadges{display:flex;flex-direction:column;gap:8px}
.nb{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 14px);padding:10px 12px}
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead b{font:700 20px var(--display);text-transform:uppercase}
.iconbtn.sm{width:36px;height:36px;font-size:20px}
.iconbtn:disabled{opacity:.35;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{font-size:11px;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:calc(var(--rs) * 10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;border:0;background:none;color:var(--muted);font-variant-numeric:tabular-nums}
.cd.has{background:var(--accent-soft);color:var(--ink);font-weight:600;cursor:pointer}
.cd.today{box-shadow:0 0 0 2px var(--accent) inset;color:var(--ink)}
.cd em{display:flex;gap:2px;height:6px}
.cd em i,.callegend i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.cd em i.run,.callegend i.run{background:var(--run)}
.callegend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.callegend span{display:inline-flex;gap:5px;align-items:center}
.callegend .addset{margin-left:auto;color:var(--accent);font-weight:600}
.resume.recap{background:var(--ink);color:var(--bg)}
.alts{display:flex;flex-direction:column;gap:8px}
.altrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:calc(var(--rs) * 12px);background:var(--bg);cursor:pointer;position:relative;width:100%}
.altrow small{color:var(--muted);font-size:13px}
.altrow.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.altrow .pill{position:absolute;right:12px;top:12px}
.warmcard{border-color:var(--accent);border-style:dashed}
.warmdone{font-size:14px;color:var(--good);font-weight:600}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#timerlayer{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--bg);display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#timerlayer.fast{background:var(--accent);color:var(--on-accent)}
#timerlayer.slow{background:var(--run);color:#fff}
:root[data-theme="dark"] #timerlayer.slow{color:#0b2422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #timerlayer.slow{color:#0b2422}}
.tmin{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px}
.tmtop{display:flex;justify-content:space-between;font:700 16px var(--display);text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.tmmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.tmphase{margin:0;font:700 clamp(30px,10.5vw,44px)/1.05 var(--display);text-transform:uppercase;text-wrap:balance;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.tmtime{margin:0;font:700 clamp(84px,30vw,150px)/1 var(--display)}
.tmtime.cd{animation:cdpulse .9s ease-out;text-shadow:0 0 40px rgba(255,255,255,.55)}
@keyframes cdpulse{0%{transform:scale(1.35);opacity:.4}35%{transform:scale(1);opacity:1}100%{transform:scale(1)}}
.tmr{display:flex;align-items:center;gap:10px}
.tmsnd{border:0;background:rgba(127,127,127,.25);color:inherit;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer}
.tm .track{background:rgba(127,127,127,.35);height:10px}
.tm .track i{display:block;height:100%;background:currentColor;border-radius:calc(var(--rs) * 5px)}
.tminfo{margin:0;font-size:17px;opacity:.9;max-width:40ch}
.tmnext{margin:0;font-size:15px;opacity:.85}
.tmbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tmbtns .secondary{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:inherit;height:54px;font-size:17px}

/* Yoga */
.start[data-kind="yoga"] .stripe{background:var(--yoga)}
.start.next[data-kind="yoga"]{border-color:var(--yoga);box-shadow:0 0 0 1px var(--yoga) inset}
.start[data-kind="yoga"] .tag{color:var(--yoga)}
.pill.yoga{background:var(--yoga-soft);color:var(--yoga)}
.dot.yoga,.cd em i.yoga,.callegend i.yoga{background:var(--yoga)}
.primary.yoga{background:#6a52c9;color:#fff}
.tile.yoga b{color:var(--yoga)}
.yogacard{border-left:4px solid var(--yoga)}
.intro.yoga{background:var(--yoga-soft)}
.yogaup{background:var(--yoga-soft)}

.flowlist summary{cursor:pointer;color:var(--yoga);font-weight:600;font-size:14px}
.flowlist ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.flowlist li{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.flowlist li:first-child{border-top:0}
.flowlist li small{display:block;color:var(--muted);font-size:12px;font-style:italic}
.flowlist li b{font-weight:500;color:var(--muted);font-size:13px}
.thumb{width:64px;height:45px;color:var(--yoga);background:var(--yoga-soft);border-radius:calc(var(--rs) * 8px);padding:3px}
.tmpose{width:min(86%,340px);height:auto;max-height:30vh;align-self:center;margin-bottom:4px}
#timerlayer.yoga{background:#5b45b8;color:#fff}
.tmsub{margin:-6px 0 0;font-size:16px;font-style:italic;opacity:.85}

.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.mv{display:inline-flex;gap:6px}
.mv button{width:34px;height:34px;border-radius:calc(var(--rs) * 10px);border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:16px;cursor:pointer}
/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,8,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font:700 24px/1.1 var(--display);text-transform:uppercase}
.sheet p{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{height:40px;border-radius:calc(var(--rs) * 10px);border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:20px}
.stepper b{font:700 26px var(--display);min-width:24px;text-align:center}
.inp{width:100%;height:46px;border:1px solid var(--line);border-radius:calc(var(--rs) * 12px);background:var(--bg);color:var(--ink);font:16px var(--body);padding:0 12px}
.detail .exn{font-weight:600;margin-top:4px}
.detail .sets{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:calc(var(--rs) * 999px);font-size:14px;max-width:90vw}
.brand{display:flex;align-items:center;gap:9px;font:700 17px var(--display);text-transform:uppercase;letter-spacing:.04em}
.brand img{width:30px;height:30px;border-radius:calc(var(--rs) * 8px)}
.hero{border-radius:calc(var(--rs) * 24px);padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,#c4306a,#7a2a8f);display:flex;flex-direction:column;align-items:flex-start;gap:6px;box-shadow:0 10px 30px -12px rgba(176,36,90,.6);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.hero.run{background:linear-gradient(135deg,#239089,#155e75);box-shadow:0 10px 30px -12px rgba(35,144,137,.6)}
.hero.yoga{background:linear-gradient(135deg,#7a62d6,#4b3aa8);box-shadow:0 10px 30px -12px rgba(122,98,214,.6)}
.hero.gold{background:linear-gradient(135deg,#d99a1e,#c4306a);box-shadow:0 10px 30px -12px rgba(217,154,30,.6)}
.hero small{opacity:.85;font-size:13px}
.hero h2{margin:0;font:700 34px/1 var(--display);text-wrap:balance}
.hero p{margin:0;font-size:15px;line-height:1.4;color:#fff;opacity:.95}
.herobtn{position:relative;z-index:1;margin-top:8px;border:0;border-radius:calc(var(--rs) * 999px);background:#fff;color:#7a2a8f;font:700 15px var(--body);padding:10px 18px;cursor:pointer}
.hero.run .herobtn{color:#155e75}.hero.yoga .herobtn{color:#4b3aa8}.hero.gold .herobtn{color:#a33a1a}
.heroalt{position:relative;z-index:1;font-size:13px;opacity:.92}
.heroalt .linkbtn{color:#fff;font-size:13px}
.cd{border-radius:50%;max-width:42px;width:100%;margin:auto}
.cd.has{background:var(--accent);color:#fff;font-weight:700}
.cd.has.run{background:var(--run)}.cd.has.yoga{background:var(--yoga)}
.cd.has em{display:none}
.cd.has.multi em{display:flex}
.cd.has em i{background:#fff!important;width:4px;height:4px}
.cd.has.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sprog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);border-radius:0 2px 2px 0;transition:width .4s ease}
.bottombar .primary[data-act=finish]{height:48px;font-size:18px;border-radius:calc(var(--rs) * 999px);box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.hero{--g1:196,48,106;--g2:122,42,143}
.hero.run{--g1:35,144,137;--g2:21,94,117}
.hero.yoga{--g1:122,98,214;--g2:75,58,168}
.hero.gold{--g1:217,154,30;--g2:196,48,106}
.hero > *:not(.hph){position:relative;z-index:1}
.hero.photo,.hero.photo.run,.hero.photo.yoga,.hero.photo.gold{--g1:196,48,106;--g2:122,30,80;box-shadow:0 10px 30px -12px rgba(176,36,90,.6)}
.hero.photo .herobtn{color:#a3245a}
.hero.photo{min-height:390px;justify-content:flex-end;padding-top:56px}
.hero.photo::after{display:none}
.hero.photo > small{position:absolute;top:16px;left:20px;right:20px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.hero.photo h2{text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hph{position:absolute;inset:0;z-index:0;overflow:hidden;background:rgb(var(--g2))}
.hph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;filter:saturate(1.08) contrast(1.04) sepia(.1) brightness(1.02);opacity:0;transition:opacity 2.4s ease-in-out;animation-duration:14s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.hph img.on{opacity:1}
.hblur{position:absolute;left:0;right:0;bottom:0;height:58%;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 50%);mask-image:linear-gradient(to bottom,transparent,#000 50%)}
.hov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(var(--g1),0) 22%,rgba(var(--g1),.3) 45%,rgba(var(--g2),.9) 75%,rgb(var(--g2)) 100%)}
.hdots{display:flex;gap:5px;margin-bottom:4px}
.hdots i{width:6px;height:6px;border-radius:calc(var(--rs) * 3px);background:rgba(255,255,255,.5);transition:width .4s,background .4s}
.hdots i.on{width:16px;background:#fff}
.hero.big{min-height:440px;justify-content:flex-end;cursor:pointer;padding-top:56px}
.hero.big > small{position:absolute;top:16px;left:20px;right:20px}
.hero.big h2{font-size:42px}
.hero.big .herobtn{font-size:16px;padding:12px 22px}
.hero .hplay{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-size:28px;padding-left:5px;box-sizing:border-box;color:#fff;animation:hpulse 2.4s ease-in-out infinite}
@keyframes hpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){.hph img,.hero .hplay{animation:none}}
.greet{margin:-6px 0 0;display:flex;flex-direction:column;gap:2px}
.greet b{font-size:17px;font-weight:600}
.greet span{font-size:14px;color:var(--muted)}
.infobtn{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:7px;border-radius:50%;border:1.5px solid currentColor;background:none;color:var(--muted);font:700 12px/1 var(--body);vertical-align:2px;cursor:pointer;padding:0}
.hint .linkbtn{font-size:13px}
.expose{width:100%;max-width:340px;height:auto;align-self:center;color:var(--accent);background:var(--accent-soft);border-radius:calc(var(--rs) * 16px);padding:10px}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.nextup{gap:8px}
.nextup p{margin:0;font-size:15px}
.alsterc{margin:0;font-size:14px}
.alsterc b{color:var(--run)}
.start small.wxs{color:var(--run)}
.wxl{display:flex;flex-direction:column;gap:2px;background:var(--run-soft);border-radius:calc(var(--rs) * 12px);padding:10px 12px;font-size:13px;color:var(--muted)}
.wxl b{font-size:15px;color:var(--ink);font-weight:600}
.wxl .v{color:var(--run);font-weight:600;font-size:14px}
.yearlink{display:block;margin:10px 2px 0;font-size:14px}
.resume.yearcard{background:linear-gradient(120deg,#c4306a,#6a52c9);color:#fff}
.bbrow{display:grid;grid-template-columns:1fr 2fr;gap:10px;align-items:center}
.bbrow .secondary{height:54px;border-radius:calc(var(--rs) * 16px)}
a.dl{display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.story{position:fixed;inset:0;z-index:38;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 24px);background:linear-gradient(160deg,#c4306a,#5a1438);user-select:none;-webkit-user-select:none;cursor:pointer;overflow:auto}
.story.s2{background:linear-gradient(160deg,#7a62d6,#33266f)}
.story.s3{background:linear-gradient(160deg,#e0784a,#8f2a3c)}
.story.s4{background:linear-gradient(160deg,#239089,#0e3c39)}
.story.s5{background:linear-gradient(160deg,#c4306a,#3d1030)}
.story.s6{background:linear-gradient(160deg,#5b45b8,#22184f)}
.story.s7{background:linear-gradient(160deg,#c98a12,#6e3f08)}
.story.has-photo{background-color:#111}
.sy-bg{position:absolute;inset:-4%;background-size:cover;background-position:center;z-index:0;animation:kb0 9s ease-out both}
.sy-bg.kb1{animation-name:kb1}.sy-bg.kb2{animation-name:kb2}
@keyframes kb0{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-1%)}}
@keyframes kb1{from{transform:scale(1.12) translate(2%,1%)}to{transform:scale(1)}}
@keyframes kb2{from{transform:scale(1.04) translate(-2%,2%)}to{transform:scale(1.14) translate(2%,-2%)}}
.sy-tint{position:absolute;inset:0;z-index:0;background:inherit;opacity:.42}
.has-photo .sy-tint{background:inherit}
.sy-shade{position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.12) 30%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.72))}
.has-photo .sy-in,.has-photo .sy-prog,.has-photo .sy-hint{position:relative;z-index:1}
.has-photo .sy-hint{position:absolute}
.has-photo .sy-x,.has-photo .sy-snd{z-index:2}
.has-photo .sy-big,.has-photo .sy-num,.has-photo .sy-p{text-shadow:0 2px 14px rgba(0,0,0,.45)}
.has-photo .sy-list p{background:rgba(0,0,0,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
[hidden]{display:none!important}
.phgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:calc(var(--rs) * 10px);overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer}
.nrc{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.nrc .secondary{width:100%}
.nrc .linkbtn{font-size:13px}
.guide code{font-size:12px;background:var(--bg);padding:1px 4px;border-radius:calc(var(--rs) * 4px)}
.sy-prog{display:flex;gap:4px;padding-right:96px}
.sy-snd{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:58px;border:0;background:rgba(255,255,255,.18);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.sy-prog i{flex:1;height:3px;border-radius:calc(var(--rs) * 2px);background:rgba(255,255,255,.3)}
.sy-prog i.done,.sy-prog i.on{background:#fff}
.sy-x{position:absolute;top:calc(env(safe-area-inset-top) + 4px);right:14px;border:0;background:rgba(255,255,255,.18);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.sy-in{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;max-width:520px;width:100%;margin:0 auto;padding:16px 0}
.sy-eb{margin:0;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.sy-big{margin:0;font:700 56px/1 var(--display);text-transform:uppercase;text-wrap:balance}
.sy-num{margin:0;font:700 96px/1 var(--display)}
.sy-p{margin:0;font-size:19px;line-height:1.4}
.sy-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 28px);left:0;right:0;text-align:center;font-size:13px;opacity:.7;margin:0}
.sy-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sy-list p{margin:0;font-size:17px;background:rgba(255,255,255,.14);border-radius:calc(var(--rs) * 14px);padding:10px 14px}
.sy-list p.sy-sm{background:none;padding:0;font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
.sy-pill{display:inline-block;background:#fff;color:#1f1a24;border-radius:calc(var(--rs) * 999px);padding:1px 8px;font-size:13px;font-weight:700;margin-left:4px}
.sy-bars{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.sbar2{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:15px}
.sbar2 .tr{display:block}
.sbar2 i{display:block;height:12px;border-radius:calc(var(--rs) * 6px);background:#fff}
.sbar2 b{text-align:right}
.sy-badges{background:rgba(255,255,255,.92);border-radius:calc(var(--rs) * 16px);padding:12px;color:#1f1a24}
.sy-of{font-size:.45em;opacity:.7;margin-left:4px}
.wdstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd .wdc{width:100%;aspect-ratio:1;max-width:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:18px;line-height:1}
.wd.on .wdc{background:#fff;border-color:#fff}
.wd.today .wdc{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.wd small{font-size:12px;opacity:.85}
.sy-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.sy-btn{height:52px;border:0;border-radius:calc(var(--rs) * 16px);background:#fff;color:#5a1438;font:700 19px var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.sy-btn.ghost{background:rgba(255,255,255,.18);color:#fff}
/* Lauf schnell eintragen */
.runwrap{display:flex;flex-direction:column;gap:12px}
.wx1{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--run);background:var(--run-soft);border-radius:calc(var(--rs) * 14px);padding:9px 12px;font-weight:600}
.runroute{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rs) * 18px);padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
.runroute b{display:block;font:700 22px var(--display);text-transform:uppercase}
.runroute small{color:var(--muted);font-size:13px}
.runroute .lk{color:var(--run);font-weight:600;font-size:13px}
.runroute2{display:flex;flex-direction:column;gap:10px}
.runtime{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--run);border-radius:calc(var(--rs) * 22px);padding:14px 16px 16px;cursor:text}
.runtime small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.runtime input{width:100%;border:0;background:none;text-align:center;font:700 64px/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums;padding:0;outline:none}
.runtime input::placeholder{color:var(--line)}
.runtime .ri{font-size:14px;color:var(--muted);text-align:center}
.runtime.shake{animation:sh .35s}
.runwin{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#2aa39a,#166b6a);color:#fff;border-radius:calc(var(--rs) * 16px);padding:12px 14px;font-size:14px;font-weight:600;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.runwin.soft{background:var(--run-soft);color:var(--run)}
.runwin span{font-size:22px}
.shotbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line);border-radius:calc(var(--rs) * 16px);padding:13px;background:var(--surface);cursor:pointer;text-align:left}
.shotbtn .ic{font-size:22px}.shotbtn b{display:block;font-size:15px}.shotbtn small{display:block;color:var(--muted);font-size:12px}
.runnote summary{list-style:none;color:var(--run);font-weight:600;font-size:14px;padding:2px 4px;cursor:pointer}
.runnote summary::-webkit-details-marker{display:none}

.kmchip{align-self:flex-start;border:1px solid var(--run);background:var(--run-soft);color:var(--run);border-radius:calc(var(--rs) * 999px);padding:5px 11px;font:600 12.5px var(--body);cursor:pointer}

.plseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plseg button,.pldays button{border:1.5px solid var(--line);background:var(--surface);border-radius:calc(var(--rs) * 14px);padding:10px 0;font:inherit;color:var(--ink);cursor:pointer}

/* Speicherort: device = installierte App (auf dem Handy), checking, cloud = Claude-Konto, local = Claude-Link ohne Schreibrecht */
let sync = "checking";
function syncHtml(){

function save(){

  if(!ref) return;

async function flush(){
  saveTimer = null; if(!ref) return;
  if(writing){ dirty = true; return; }
  const body = JSON.stringify(S); if(body===lastSent) return;
  writing = true;
  try{ await ref.set(JSON.parse(body)); lastSent = body; setSync("cloud"); }
  catch(err){
    if(err && ["invalid_argument","revoked","not_granted"].includes(err.code)){ ref = null; setSync("local"); }
    else if(err && err.code==="unavailable") setTimeout(flush, 1500 + Math.random()*1500);
  }finally{ writing = false; if(dirty){ dirty = false; flush(); } }
}
function merge(local, remote){
  const ids = new Set(), hist = [];
  [...(remote.history||[]), ...(local.history||[])].forEach(e => { if(e && !ids.has(e.id)){ ids.add(e.id); hist.push(e); } });
  hist.sort((a,b) => a.start-b.start);
  let active = local.active || remote.active;
  if(local.active && remote.active) active = local.active.start >= remote.active.start ? local.active : remote.active;
  if(active && ids.has("s"+active.start)) active = null;
  return normalize({active, history:hist, settings:Object.assign({}, local.settings, remote.settings||{}), badges:Object.assign({}, remote.badges||{}, local.badges||{})});
}
async function initCloud(){

    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if(!user || !db){ setSync("local"); return; }
    const uid = await user.id(); if(!uid){ setSync("local"); return; }
    const r = db.doc("data/users/"+uid+"/app");
    let first = true;
    r.onSnapshot(snap => {
      if(first && snap.metadata.fromCache) return;
      if(first){
        first = false; ref = r;
        if(snap.exists && snap.data()){
          setSync("cloud");
          S = merge(S, snap.data()); lastSent = JSON.stringify(snap.data());
          save(); applyTheme(); if(!isTyping()) render();
        }else if(S.history.length || S.active){ save(); }
        return;
      }
      if(snap.metadata.hasPendingWrites || saveTimer || writing || !snap.exists) return;
      const inc = JSON.stringify(snap.data());
      if(inc===lastSent || inc===JSON.stringify(S) || isTyping()) return;
      S = normalize(snap.data()); lastSent = inc;
      try{ localStorage.setItem(LS, inc); }catch(e){}
      applyTheme(); render();
    }, () => { ref = null; setSync("local"); });
  }catch(e){ setSync("local"); }
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v==null?"":v).replace(",", ".")); return isFinite(n) ? n : 0; };
const fmt = (n,d=1) => Number(n).toLocaleString("de-DE",{maximumFractionDigits:d});
const filled = s => s && String(s.r==null?"":s.r).trim()!=="";

function parseMin(v){
  const t = String(v||"").trim(); if(!t) return 0;
  if(t.includes(":")){ const p = t.split(":"); if(p.length>=3) return num(p[0])*60 + num(p[1]) + num(p[2])/60; return num(p[0]) + num(p[1])/60; }
  return num(t);
}
function mmss(min){ if(!(min>0)) return "–"; let m = Math.floor(min), s = Math.round((min-m)*60); if(s===60){m++;s=0;} return m+":"+String(s).padStart(2,"0"); }
function hms(min){ if(min>=60){ const h = Math.floor(min/60); return h+":"+mmss(min-h*60).padStart(5,"0"); } return mmss(min); }
const paceOf = (km,min) => km>0 && min>0 ? min/km : 0;
function durTxt(ms){ const m = Math.max(0, Math.round(ms/60000)); return m<60 ? m+" min" : Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"; }
/* Gym-Uhr stoppt automatisch nach 60 Minuten (falls das Beenden vergessen wird) */
const GYM_MAX = 60*60000;
function isGym(t){ return !!(W[t] && W[t].kind==="gym"); }
function elapsedOf(a){ const d = Date.now()-a.start; return isGym(a.type) ? Math.min(d, GYM_MAX) : d; }
function elapsedTxt(a){ const c = clock(elapsedOf(a)); return isGym(a.type) && Date.now()-a.start>=GYM_MAX ? c+" · gestoppt" : c; }
/* Kalorien-Schätzung (MET-Werte bzw. ~1 kcal pro kg und km beim Laufen) */
function kcalOn(){ return S.settings.showKcal!==false && num(S.settings.bodyKg)>0; }
function distKcal(km, min, kg){ const v = min>0 ? km/(min/60) : 10; return km*kg*(v<7 ? 0.6 : 1.0); }
/* Laufband: ACSM-Formel mit Steigung (Gehen bis ~7,2 km/h, darüber Laufen) */
function treadKcal(km, min, incl, kg){
  if(!(km>0) || !(min>0)) return 0;
  const s = km*1000/min, g = Math.max(0, Math.min(30, num(incl)))/100;
  const vo2 = s <= 120 ? .1*s + 1.8*s*g + 3.5 : .2*s + .9*s*g + 3.5;
  return vo2*kg*min/1000*5;
}
function kcalOf(e){
  const kg = num(S.settings.bodyKg); if(!(kg>0)) return 0;
  let k = 0;
  if(e.run){ const km = num(e.run.km), mn = num(e.run.min); k += e.run.mode==="band" && km>0 && mn>0 ? treadKcal(km, mn, e.run.incline, kg) : km>0 ? distKcal(km, mn, kg) : mn*kg*9.8/60; }
  if(e.yoga) k += num(e.yoga.min)*kg*(e.yoga.flow ? 3.5 : 3.0)/60;
  if(isGym(e.type)){
    const nSets = Object.values(e.sets||{}).reduce((x,a) => x+a.length, 0);
    const tot = Math.min(60, Math.max(((e.end||e.start)-e.start)/60000, nSets*3)), tm = e.tread ? num(e.tread.min) : 0;
    if(e.tread) k += num(e.tread.km)>0 && tm>0 ? treadKcal(num(e.tread.km), tm, e.tread.incline, kg) : tm*kg*(6 + num(e.tread.incline)*.45)/60;
    if(e.sets) k += Math.max(0, tot-tm)*kg*5/60;
  }
  return Math.round(k/5)*5;
}
function clock(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h? h+":"+String(m).padStart(2,"0") : m)+":"+String(x).padStart(2,"0"); }

function mondayOf(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d.getTime(); }
const WEEK = 7*864e5;
function ago(ts){
  const a = new Date(); a.setHours(0,0,0,0); const b = new Date(ts); b.setHours(0,0,0,0);
  const n = Math.round((a-b)/864e5);
  return n<=0 ? "heute" : n===1 ? "gestern" : "vor "+n+" Tagen";
}
const e1 = (kg,r) => kg>0 && r>0 ? kg*(1+r/30) : 0;
function volOf(e){ let v = 0; Object.values(e.sets||{}).forEach(a => a.forEach(s => v += num(s.r)*num(s.kg))); return v; }
function kmOf(e){ return (e.run? num(e.run.km) : 0) + (e.tread? num(e.tread.km) : 0); }
function lastSets(id){ for(let i=S.history.length-1;i>=0;i--){ const a = (S.history[i].sets||{})[id]; if(a && a.length) return a; } return null; }
function lastRun(mode){ for(let i=S.history.length-1;i>=0;i--){ const e = S.history[i]; if(e.run && (!mode || e.run.mode===mode)) return e.run; } return null; }
function lastTread(){ for(let i=S.history.length-1;i>=0;i--){ if(S.history[i].tread) return S.history[i].tread; } return null; }

/* ================= Statistik ================= */
function stats(){
  const H = S.history, now = Date.now(), ws = mondayOf(now), goal = S.settings.goal;
  const weeks = []; for(let i=11;i>=0;i--){ const a = ws - i*WEEK; weeks.push(H.filter(e => e.start>=a && e.start<a+WEEK).length); }
  const thisWeek = weeks[11];
  const typesWeek = new Set(H.filter(e => e.start>=ws).map(e => e.type));
  let streak = 0;
  for(let i = thisWeek>=goal ? 0 : 1; ; i++){
    const a = ws - i*WEEK; const c = H.filter(e => e.start>=a && e.start<a+WEEK).length;
    if(c>=goal) streak++; else break; if(i>520) break;
  }
  const gains = [];
  Object.values(EXN).filter(e => !e.opt).forEach(ex => {
    const ss = H.filter(e => e.sets && e.sets[ex.id] && e.sets[ex.id].length);
    if(ss.length<2) return;
    const best = a => a.reduce((m,s) => Math.max(m, e1(num(s.kg),num(s.r))), 0);
    const maxKg = a => a.reduce((m,s) => Math.max(m, num(s.kg)), 0);
    const f = best(ss[0].sets[ex.id]); let b = 0, bk = 0;
    ss.forEach(e => { b = Math.max(b, best(e.sets[ex.id])); bk = Math.max(bk, maxKg(e.sets[ex.id])); });
    if(f>0 && b>f) gains.push({n:ex.n, from:maxKg(ss[0].sets[ex.id]), to:bk, pct:Math.round((b-f)/f*100)});
  });
  gains.sort((a,b) => b.pct-a.pct);
  const vol = H.reduce((a,e) => a+volOf(e), 0);
  const km = H.reduce((a,e) => a+kmOf(e), 0);
  const ms = new Date(); ms.setDate(1); ms.setHours(0,0,0,0);
  const kmMonth = H.filter(e => e.start>=ms.getTime()).reduce((a,e) => a+kmOf(e), 0);
  const runs = H.filter(e => e.run && num(e.run.km)>0);
  const alster = runs.filter(e => e.run.mode==="alster" && num(e.run.min)>0);
  const bestAlster = alster.length ? Math.min(...alster.map(e => num(e.run.min))) : 0;
  const paces = runs.map(e => paceOf(num(e.run.km), num(e.run.min))).filter(p => p>0);
  const bestPace = paces.length ? Math.min(...paces) : 0;
  const longest = runs.length ? Math.max(...runs.map(e => num(e.run.km))) : 0;
  const lastBy = {}; H.forEach(e => lastBy[e.type] = e.start);
  let next = ORDER.find(t => !typesWeek.has(t));
  if(!next) next = ORDER.slice().sort((a,b) => (lastBy[a]||0)-(lastBy[b]||0))[0];
  const alsterN = H.filter(e => e.run && e.run.mode==="alster").length;
  return {alsterN, weeks, thisWeek, goal, streak, gains, vol, km, kmMonth, bestAlster, bestPace, longest, lastBy, next, typesWeek, total:H.length};
}

    h += `<p class="bigline">${st.gains[0].n} <em>+${st.gains[0].pct} %</em></p><p class="small muted" style="margin:-6px 0 4px">mehr Kraft als bei deinem ersten Training</p>`;

  }
  if(st.vol>0) h += `<p class="small" style="margin:4px 0 0"><b class="tnum">${fmt(Math.round(st.vol),0)} kg</b> insgesamt bewegt. ${volumeLine(st.vol)}</p>`;
  h += `</div></section>`;

  // Laufen
  h += `<section><h2 class="sec">Laufen</h2><div class="card"><div class="tiles">

  // Abzeichen
  const got = BADGES.filter(x => S.badges && S.badges[x.id]).length;
  h += `<section><h2 class="sec">Abzeichen <span class="tnum" style="letter-spacing:0">${got} / ${BADGES.length}</span></h2><div class="card">${nextBadgeHtml()}<div class="badges">${BADGES.map(x => badgeEl(x)).join("")}</div></div></section>`;

  // Verlauf
  const recent = S.history.slice(-8).reverse();
  h += `<section><h2 class="sec">Verlauf</h2><div class="card hist">${recent.length ? recent.map(e => {
    const w = W[e.type]; let m = "";

  }).join("") : `<p class="empty">Hier erscheinen deine Trainings, sobald du das erste beendet hast.</p>`}</div></section>`;

  $("#app").innerHTML = h;
  heroPhotos();
}

/* ================= Training ================= */
function blank(n){ return Array.from({length:n}, () => ({r:"", kg:"", ok:false})); }
/* Werte vom letzten Training vorausfüllen */
function prefill(id, i, prevRow){
  const last = lastSets(id) || [], p = last[i];
  if(p && num(p.r)>0) return {r:String(num(p.r)), kg:num(p.kg)?fmt(num(p.kg)):"", ok:false};
  if(prevRow && filled(prevRow)) return {r:prevRow.r, kg:prevRow.kg, ok:false};
  if(last.length){ const q = last[last.length-1]; return {r:String(num(q.r)), kg:num(q.kg)?fmt(num(q.kg)):"", ok:false}; }
  return {r:"", kg:"", ok:false};
}
function prefilledSets(ex){ const arr = []; for(let i=0;i<ex.s;i++) arr.push(prefill(ex.id, i, arr[i-1])); return arr; }
function startSession(t, mode){
  const a = {type:t, start:Date.now(), sets:{}, open:{}, tread:null, run:null};
  (W[t].ex||[]).forEach(e => { if(!e.opt) a.sets[e.id] = prefilledSets(e); });
  if(t==="yoga") a.yoga = {min:"", note:"", flow:false};
  if(t==="lauf"){
    a.run = mode==="band" ? {mode:"band", km:"", min:"", note:""} : {mode:"out", km:"", min:"", note:""};
  }
  S.active = a; screen = "session"; rest = null; save(); render(); window.scrollTo(0,0);
}

function setRows(ex){
  const a = S.active, arr = a.sets[ex.id] || [], last = lastSets(ex.id) || [];
  return arr.map((s,i) => {
    const p = last[i] || last[last.length-1] || {};
    return `<div class="setrow ${isDone(s)?"done":filled(s)?"pre":""}" data-row="${ex.id}-${i}">
      ${i>=ex.s?`<button class="rmset" data-act="rmset" data-ex="${ex.id}" data-i="${i}" aria-label="Satz ${i+1} entfernen">−</button>`:`<span class="sn">${i+1}</span>`}
      <div class="field"><input inputmode="numeric" autocomplete="off" id="r-${ex.id}-${i}" data-in="set" data-ex="${ex.id}" data-i="${i}" data-f="r" value="${esc(s.r)}" placeholder="${p.r!=null?esc(p.r):ex.r[1]}" aria-label="${ex.n} Satz ${i+1} Wiederholungen"><span class="u">Wdh</span></div>
      <div class="field"><input inputmode="decimal" autocomplete="off" id="kg-${ex.id}-${i}" data-in="set" data-ex="${ex.id}" data-i="${i}" data-f="kg" value="${esc(s.kg)}" placeholder="${p.kg!=null?esc(fmt(num(p.kg))):""}" aria-label="${ex.n} Satz ${i+1} Gewicht"><span class="u">kg</span></div>
      <button class="tick" data-act="tick" data-ex="${ex.id}" data-i="${i}" aria-label="Satz ${i+1} fertig">✓</button></div>`;
  }).join("");
}

function exCard(ex, base, pos){
  base = base || ex; pos = pos || {};
  const last = lastSets(ex.id);
  let ll = "", hint = "";
  if(last){
    ll = `<div class="lastl tnum">Letztes Mal: ${last.map(s => `${fmt(num(s.r))}×${fmt(num(s.kg))}`).join(" · ")} kg</div>`;
    const up = upSuggest(ex.id, last);
    if(up){
      const cur = (S.active.sets[ex.id]||[]).filter(x => !isDone(x)), applied = cur.length && cur.every(x => num(x.kg)===up);
      hint = `<div class="hint">💪 Letztes Mal alle Sätze geschafft. Heute <b>${fmt(up)} kg</b> probieren (+${fmt(stepOf(ex.id))} kg).${applied?` <span>✓ übernommen</span>`:` <button class="linkbtn" data-act="applyup" data-ex="${ex.id}" data-kg="${up}">Übernehmen</button>`}</div>`;
    }
  }
  const opt = ex.opt;
  return `<article class="card ${opt?"opt":""}">
    <div class="exhead"><h3>${ex.n}<button class="infobtn" data-act="guide" data-ex="${ex.id}" aria-label="Anleitung ${esc(ex.n)}">i</button>${ex.de?`<small>${ex.de}</small>`:""}</h3>

    ${ex.cue?`<p class="cue">${ex.cue}</p>`:""}${ll}${hint}
    <div class="colhead"><span>Satz</span><span>Wdh</span><span>Gewicht</span><span></span></div>
    <div class="sets">${setRows(ex)}</div>

function alsterKm(){ const lr = lastRun("alster"); return lr && num(lr.km)>0 ? num(lr.km) : ALSTER_KM; }
function fmtTimeDigits(v){
  const d = String(v||"").replace(/\D/g, "").replace(/^0+(?=\d{3})/, "").slice(0,6);
  if(d.length<=2) return d;
  if(d.length<=4) return d.slice(0,-2) + ":" + d.slice(-2);
  return d.slice(0,-4) + ":" + d.slice(-4,-2) + ":" + d.slice(-2);
}
function runDateTxt(a){ const t = a.runAt || Date.now(); return new Date(t).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"}) + (a.runAt ? ", " + new Date(t).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) : ""); }
function runInfoHtml(){
  const r = S.active.run, min = parseMin(r.min), km = num(r.km), st = stats();
  const isAl = r.mode!=="band" && km>0 && Math.abs(km - alsterKm()) < 1.2, lr = isAl ? lastRun("alster") : lastRun(r.mode);
  const best = isAl ? st.bestAlster : 0;
  const parts = [];
  if(min>0 && km>0) parts.push(`${mmss(min/km)} /km`);
  if(lr && num(lr.min)>0) parts.push(`Letztes Mal ${hms(num(lr.min))}`);
  if(!(min>0) && best) parts.push(`Bestzeit ${hms(best)}`);
  let win = "";
  if(min>0 && isAl && best && min < best - 1e-9) win = `<div class="runwin">${rico("race")}<div>Neue Bestzeit an der Alster! ${mmss(best-min)} schneller als dein bisheriger Rekord.</div></div>`;
  else if(min>0 && lr && num(lr.min)>0 && min < num(lr.min) - 1e-9 && Math.abs(km - num(lr.km)) < .3) win = `<div class="runwin soft">${rico("tempo")}<div>${mmss(num(lr.min)-min)} schneller als beim letzten Mal.</div></div>`;
  if(r.mode!=="band" && !(S.active.runAt && S.active.runAt < mondayOf(Date.now()))) win += planHint(km, min);
  return {line:parts.join(" · ") || "Trag einfach die Zeit aus deiner Lauf-App ein.", win};
}

    <div class="wx1" data-wx="plain"${WX?"":" hidden"}>${wxPlain()}</div>

    ${kmBox}${timeBox}<div id="runwin">${inf.win}</div>${note}</div>`;

/* ---- Form & Prognose ---- */
const riegel = (t1, d1, d2) => t1*Math.pow(d2/d1, 1.06);
function runForm(){
  const rs = S.history.filter(e => e.run && e.run.mode!=="band" && num(e.run.km)>=3 && num(e.run.min)>0 && e.start > Date.now()-70*864e5);
  let best = null;
  rs.forEach(e => { const p10 = riegel(num(e.run.min), num(e.run.km), 10); if(!best || p10<best.p10) best = {e, p10, km:num(e.run.km), min:num(e.run.min)}; });
  return best;
}
function predict(d){ const f = runForm(); return f ? riegel(f.min, f.km, d) : 0; }
function planTitle(p){
  if(p.goal==="k10") return `10 km unter ${hms(p.target)}`;
  if(p.goal==="hm") return p.target ? `Halbmarathon unter ${hms(p.target)}` : "Halbmarathon schaffen";
  if(p.goal==="alster") return `Alsterrunde unter ${hms(p.target)}`;
  return "Fit bleiben";
}
function planDist(p){ return p.goal==="k10" ? 10 : p.goal==="hm" ? 21.1 : p.goal==="alster" ? alsterKm() : 0; }

/* ---- Plan berechnen ---- */
function planWeeks(p){
  const ws0 = mondayOf(p.created), ak = alsterKm();
  let n = p.date ? Math.ceil((mondayOf(p.date) + WEEK - ws0)/WEEK) : Math.max(4, Math.ceil((mondayOf(Date.now()) - ws0)/WEEK) + 4);
  n = Math.max(3, Math.min(26, n));
  const f10 = predict(10), cur = f10 ? f10/10 : 6.5;
  const gp = p.goal==="k10" ? p.target/10 : p.goal==="alster" ? p.target/ak : p.goal==="hm" ? (p.target ? p.target/21.1 : riegel(cur*10, 10, 21.1)/21.1) : cur;
  const easy = Math.max(cur, gp) + .55;
  const days = (p.days && p.days.length ? p.days : [2, 0]).slice(0, p.perWeek).sort((a,b) => ((a+6)%7) - ((b+6)%7));
  const W2 = [];
  for(let i=0; i<n; i++){
    const ws = ws0 + i*WEEK, f = n>1 ? i/(n-1) : 1, last = i===n-1, runs = [];
    const tp = p.goal==="hm" ? gp - .1 : cur + (gp-cur)*Math.min(1, f*1.15);
    const longKm = p.goal==="k10" ? Math.round((7 + 4*f)*2)/2 : p.goal==="hm" ? Math.round((8 + 10*Math.min(1, f/.85))*2)/2 : ak;
    const mk = {
      easy:(km) => ({type:"easy", km, pace:easy, label:`Locker · ${fmt(km)} km`, desc:`ca. ${mmss(easy)} /km, ganz entspannt`}),
      tempo:() => ({type:"tempo", km:ak, target:tp*ak, label:"Tempo · Alsterrunde", desc:`Ziel unter ${hms(tp*ak)} (${mmss(tp)} /km)`}),
      int:() => { const r = 4 + Math.round(f*3); return {type:"int", km:6, label:`Intervalle · ${r} × 3 min`, desc:`zügig mit ca. ${mmss(Math.max(3.5, gp-.15))} /km, dazwischen 2 min locker`}; },
      long:(km) => ({type:"long", km, pace:easy+.1, label:`Lang · ${fmt(km)} km`, desc:`ganz locker, ca. ${mmss(easy+.1)} /km${km>=8.5 && km<=10.5 ? " · Alster + Binnenalster" : ""}`}),
      race:() => p.goal==="alster" ? {type:"race", km:ak, target:p.target, label:"Alster-Test", desc:`Ziel unter ${hms(p.target)}`} : {type:"race", km:planDist(p), target:p.target, label:p.goal==="hm" ? "Lauftag · Halbmarathon" : "Lauftag · 10 km", desc:p.target ? `Ziel unter ${hms(p.target)}` : "Ankommen und genießen"}
    };
    let plan;
    if(p.goal==="fit") plan = p.perWeek===2 ? [mk.easy(5), {...mk.easy(ak), label:"Locker · Alsterrunde"}] : [{...mk.easy(ak), label:"Locker · Alsterrunde"}];
    else if(last) plan = p.perWeek===2 ? [mk.easy(5), mk.race()] : [mk.race()];
    else if(p.perWeek===2) plan = [i%2===0 ? mk.tempo() : mk.int(), p.goal==="alster" ? {...mk.easy(ak), label:"Locker · Alsterrunde"} : mk.long(longKm)];
    else plan = [i%2===0 ? (p.goal==="alster" ? mk.tempo() : mk.long(longKm)) : mk.tempo()];
    plan.forEach((r, j) => {
      const d = days[j] ?? days[days.length-1];
      r.date = ws + ((d+6)%7)*864e5 + 12*3600e3;
      if(r.type==="race" && p.date && p.date>=ws && p.date<ws+WEEK) r.date = p.date;
      runs.push(r);
    });
    runs.sort((a,b) => a.date-b.date);
    const done = S.history.filter(e => e.run && e.run.mode!=="band" && e.start>=ws && e.start<ws+WEEK).sort((a,b) => a.start-b.start);
    runs.forEach((r, j) => { const e = done[j]; if(e){ r.done = e; const km = num(e.run.km), mn = num(e.run.min); r.hit = r.target ? (mn>0 && mn <= r.target + .15) : r.type==="int" ? true : km >= r.km*.85; } });
    W2.push({ws, i, runs});
  }
  return W2;
}
function planProgress(p){
  const W2 = planWeeks(p), now = Date.now(), cw = mondayOf(now);
  let i = W2.findIndex(w => w.ws===cw); if(i<0) i = cw < W2[0].ws ? 0 : W2.length-1;
  return {W:W2, i, n:p.date ? W2.length : 0, f:W2.length>1 ? Math.min(1, (i + (W2[i].runs.filter(r => r.done).length/Math.max(1, W2[i].runs.length)))/W2.length) : 0};
}
function planNext(){
  const p = S.settings.runPlan; if(!p) return null;
  const pg = planProgress(p), today = dkey(Date.now());
  for(let k=pg.i; k<pg.W.length; k++){ const r = pg.W[k].runs.find(x => !x.done && x.date >= mondayOf(Date.now())); if(r) return Object.assign({today:dkey(r.date)===today}, r); }
  return null;
}
function planHint(km, min){
  const nx = planNext(); if(!nx || !(min>0)) return "";
  if(nx.target) return min <= nx.target + .15 ? `<div class="runwin soft">${rico("check")}<div>Plan-Ziel geschafft: ${esc(nx.label)} unter ${hms(nx.target)}</div></div>` : `<div class="runwin soft">${rico(nx.type)}<div>Für „${esc(nx.label)}“ waren ${hms(nx.target)} geplant. Gut gelaufen, nächstes Mal klappt's.</div></div>`;
  if(nx.type==="easy" || nx.type==="long"){ const pace = km>0 ? min/km : 0; if(pace && nx.pace && pace < nx.pace - .35) return `<div class="runwin soft">${rico("easy")}<div>Locker war das nicht ganz – du warst schneller als geplant. Nächstes Mal ruhig langsamer.</div></div>`; return `<div class="runwin soft">${rico("check")}<div>Passt zum Plan: ${esc(nx.label)}</div></div>`; }
  return `<div class="runwin soft">${rico("check")}<div>Wird im Plan abgehakt: ${esc(nx.label)}</div></div>`;
}

/* ================= Lauf-Screenshot lesen (Texterkennung direkt auf dem Handy) ================= */
const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let OCRW = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function ocrWorker(){
  if(OCRW) return OCRW;
  if(!window.Tesseract) await loadScript(TESS_URL);
  OCRW = await Tesseract.createWorker("eng", 1);
  return OCRW;
}
async function shotCanvas(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(2, 1400/img.naturalWidth), c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    const x = c.getContext("2d"); x.filter = "grayscale(1) contrast(1.4)"; x.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }finally{ URL.revokeObjectURL(url); }
}
function parseShot(text){
  const T = String(text||"").replace(/[’′´`]/g, "'").replace(/[”″]/g, '"'), lines = T.split(/\n/);
  const dateRe = /(\d{1,2})\.(\d{1,2})\.(\d{2,4})\s*[-–·,]?\s*(\d{1,2})[:.](\d{2})\s*(AM|PM)?/i;
  let dur = 0, durTok = "";
  const h = T.match(/\b(\d{1,2}):(\d{2}):(\d{2})\b/);
  if(h){ dur = (+h[1])*60 + (+h[2]) + (+h[3])/60; durTok = h[0]; }
  let pace = 0; const pm = T.match(/(\d{1,2})\s*[:']\s*(\d{2})\s*"?\s*(?:min)?\s*\/\s*km/i); if(pm) pace = +pm[1] + (+pm[2])/60;
  let spd = 0; const sm = T.match(/(\d{1,2}[.,]\d)\s*(?:kph|km\s*\/\s*h)/i); if(sm) spd = num(sm[1]);
  if(!dur){
    const cand = [];
    lines.forEach((l, i) => { if(i===0 || dateRe.test(l) || /\/\s*km|min\s*\/|pace|tempo/i.test(l)) return; (l.match(/\b\d{1,3}:\d{2}\b/g)||[]).forEach(tk => { const [m, s] = tk.split(":"); const v = +m + (+s)/60; if(v>=8 && v<=300) cand.push({tk, v}); }); });
    if(cand.length){ dur = cand[0].v; durTok = cand[0].tk; }
  }
  let km = 0;
  const dl = durTok ? lines.find(l => l.includes(durTok)) : null;
  if(dl){ const k = dl.replace(durTok, " ").match(/(\d{1,2}[.,]\d{1,2})(?!\d)/); if(k) km = num(k[1]); }
  if(!km){ const k = T.match(/(\d{1,2}[.,]\d{1,2})\s*(?:km|kilometer)\b/i); if(k) km = num(k[1]); }
  const est = pace && dur ? dur/pace : spd && dur ? spd*dur/60 : 0;
  if(est>0.5 && (!km || Math.abs(km-est)/est > .06)) km = est;
  let at = 0; const dm = T.match(dateRe);
  if(dm){
    let y = +dm[3]; if(y<100) y += 2000; let hh = +dm[4]; if(dm[6]){ const pmF = /pm/i.test(dm[6]); if(pmF && hh<12) hh += 12; if(!pmF && hh===12) hh = 0; }
    const t = new Date(y, +dm[2]-1, +dm[1], hh, +dm[5]).getTime();
    if(t < Date.now() + 36e5 && t > Date.now() - 400*864e5) at = t;
  }
  if(!(dur>0) && !(km>0)) return null;
  return {km:km>0 ? Math.round(km*100)/100 : 0, min:dur, at};
}
async function runShot(file){
  if(!file || !S.active || !S.active.run) return;
  sheet(`<div class="ocrwait"><div class="spin"></div><h3>Screenshot wird gelesen …</h3><p class="muted small" style="margin:0">Beim ersten Mal dauert es etwas länger. Das Bild bleibt auf deinem Handy.</p></div>`);
  try{
    const [w, c] = await Promise.all([ocrWorker(), shotCanvas(file)]);
    const { data } = await w.recognize(c);
    const r = parseShot(data.text);
    if(!r || !(r.min>0)){ sheet(`<h3>Hat leider nicht geklappt</h3><p class="muted">Ich konnte auf dem Bild keine Laufzeit finden. Trag die Zeit einfach selbst ein, das geht auch ganz schnell.</p><button class="primary run" data-act="closesheet">Okay</button>`); return; }
    const run = S.active.run;
    run.min = hms(r.min);
    if(r.km>0) run.km = fmt(r.km, 2);
    if(r.at) S.active.runAt = r.at;
    save(); closeSheet(); renderSession();
    toast(`Übernommen: ${r.km>0?fmt(r.km,2)+" km in ":""}${hms(r.min)} 🏃‍♀️`);
  }catch(e){
    sheet(`<h3>Gerade nicht möglich</h3><p class="muted">Die Texterkennung braucht beim ersten Mal Internet. Trag die Zeit einfach selbst ein.</p><button class="primary run" data-act="closesheet">Okay</button>`);
  }
}

function buildEntry(withPending){
  const a = S.active, now = Date.now(), e = {id:"s"+a.start, type:a.type, start:a.start, end:isGym(a.type) ? Math.min(now, a.start+GYM_MAX) : now};
  if(isGym(a.type) && now-a.start>GYM_MAX) e.capped = true;
  const sets = {};
  Object.keys(a.sets).forEach(id => {
    const d = a.sets[id].filter(x => isDone(x) || (withPending && filled(x))).map(s => ({r:num(s.r), kg:num(s.kg)}));
    if(d.length) sets[id] = d;
  });
  if(Object.keys(sets).length) e.sets = sets;
  if(a.tread && (parseMin(a.tread.min)>0 || num(a.tread.km)>0)){ e.tread = {min:parseMin(a.tread.min), km:num(a.tread.km)}; if(num(a.tread.incline)>0) e.tread.incline = num(a.tread.incline); }
  if(a.yoga && num(a.yoga.min)>0) e.yoga = {min:num(a.yoga.min), flow:!!a.yoga.flow, note:String(a.yoga.note||"").trim()};
  if(a.run && (num(a.run.km)>0 || parseMin(a.run.min)>0)){
    let md = a.run.mode; if(md==="out" || md==="alster") md = num(a.run.km)>0 && Math.abs(num(a.run.km) - alsterKm()) < 1.2 ? "alster" : "out";
    e.run = {mode:md, km:num(a.run.km), min:parseMin(a.run.min), note:String(a.run.note||"").trim()};
    if(md==="band" && num(a.run.incline)>0) e.run.incline = num(a.run.incline);
    const d = e.run.min*60000;
    if(a.runAt){ e.start = a.runAt; e.end = a.runAt + d; }
    else if(d>0){ e.start = Math.min(a.start, now - d); e.end = now; }
  }

}
function buildSummary(e){
  const prior = S.history, ups = [];
  const prevOf = id => { for(let i=prior.length-1;i>=0;i--){ const a = (prior[i].sets||{})[id]; if(a && a.length) return a; } return null; };
  const plural = (n, one, many) => n===1 ? one : many;
  Object.keys(e.sets||{}).forEach(id => {
    const now = e.sets[id], prev = prevOf(id), ex = EXN[id], chips = [];
    const mk = Math.max(...now.map(s => s.kg)), be = Math.max(...now.map(s => e1(s.kg,s.r)));
    let pm = -1, pe = -1;
    prior.forEach(p => (p.sets&&p.sets[id]||[]).forEach(s => { pm = Math.max(pm, num(s.kg)); pe = Math.max(pe, e1(num(s.kg),num(s.r))); }));
    const rec = pm>=0 && (mk>pm || (pe>0 && be>pe+0.01));
    if(prev){
      const pk = Math.max(...prev.map(s => num(s.kg)));
      if(mk>pk) chips.push(`+${fmt(mk-pk)} kg <span>(${fmt(pk)} → ${fmt(mk)} kg)</span>`);
      const rn = now.reduce((a,s) => a+s.r, 0), rp = prev.reduce((a,s) => a+num(s.r), 0);
      if(mk>=pk && rn>rp) chips.push(`+${rn-rp} ${plural(rn-rp,"Wiederholung","Wiederholungen")}`);
      if(now.length>prev.length){ const d = now.length-prev.length; chips.push(`+${d} ${plural(d,"Satz","Sätze")}`); }
    }
    if(chips.length || rec) ups.push({n:ex.n, chips, rec});
  });
  if(e.run){
    const pr = [...prior].reverse().find(p => p.run && p.run.mode===e.run.mode && num(p.run.km)>0);
    const chips = []; let rec = false;
    const p = paceOf(e.run.km, e.run.min);
    if(pr){
      const pp = paceOf(num(pr.run.km), num(pr.run.min));
      if(p && pp && p<pp){ const sec = Math.round((pp-p)*60); if(sec>0) chips.push(`${sec} s/km schneller <span>(${mmss(pp)} → ${mmss(p)})</span>`); }
      if(e.run.km>num(pr.run.km)) chips.push(`+${fmt(e.run.km-num(pr.run.km))} km weiter`);
    }
    if(e.run.mode==="alster" && e.run.min>0){
      const prev = prior.filter(x => x.run && x.run.mode==="alster" && num(x.run.min)>0).map(x => num(x.run.min));
      if(prev.length && e.run.min<Math.min(...prev)){ rec = true; chips.push(`Schnellste Alsterrunde: ${hms(e.run.min)}`); }
    }
    const prevKm = prior.filter(x => x.run).map(x => num(x.run.km));
    if(prevKm.length && e.run.km>Math.max(...prevKm)){ rec = true; chips.push(`Längster Lauf: ${fmt(e.run.km)} km`); }
    if(chips.length) ups.push({n:runName(e.run.mode), chips, rec});
  }
  if(e.tread){
    const pt = [...prior].reverse().find(p => p.tread);
    if(pt && e.tread.min>num(pt.tread.min)) ups.push({n:"Laufband", chips:[`+${fmt(e.tread.min-num(pt.tread.min),0)} min länger`], rec:false});
  }

  const nSets = Object.values(e.sets||{}).reduce((a,x) => a+x.length, 0);

  const weekCount = prior.filter(p => p.start>=ws).length + 1;
  return {e, ups, first:!lastSame, vol, lv, nSets, weekCount, played:false};
}

function confetti(big){
  try{ navigator.vibrate && navigator.vibrate([30,50,80]); }catch(e){}
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--run","--good"].map(v => cs.getPropertyValue(v).trim()).concat(["#ED1B34","#FC4C01"]);
  const c = document.createElement("canvas"); c.className = "confetti"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio||1), Wd = innerWidth, Ht = innerHeight;
  c.width = Wd*dpr; c.height = Ht*dpr; const x = c.getContext("2d"); x.scale(dpr,dpr);
  const n = big ? 220 : 140;
  const P = Array.from({length:n}, (_,i) => {
    const side = i%2 ? 1 : -1;
    return {x: Wd/2 + side*Wd*0.1, y: Ht*0.25, vx: side*(Math.random()*9+1) + (Math.random()-.5)*4, vy: -Math.random()*14-5,
      w: 6+Math.random()*6, h: 9+Math.random()*9, r: Math.random()*6, vr: (Math.random()-.5)*.35, c: cols[i%cols.length], wob: Math.random()*6};
  });
  const t0 = performance.now(), dur = big ? 3800 : 3000;
  (function f(t){
    const el = t - t0; x.clearRect(0,0,Wd,Ht);
    P.forEach(p => {
      p.vy = Math.min(p.vy + 0.3, 7); p.vx *= 0.985; p.wob += 0.1;
      p.x += p.vx + Math.sin(p.wob)*0.6; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - Math.max(0, el-dur*0.6)/(dur*0.4));
      x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/4, p.w, p.h/2*Math.abs(Math.cos(p.wob))+1); x.restore();
    });
    if(el<dur) requestAnimationFrame(f); else c.remove();
  })(t0);
}

async function offerFile(name, text, mime){
  if(window.claude && window.claude.use){
    try{
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename:name, data:text}); return "ok"; }
    }catch(err){ if(err && err.code==="declined") return "declined"; if(err && err.code==="rejected_extension") return "ext"; }
  }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); return "ok";
  }catch(e){ return "fail"; }
}

function spark(vals){
  if(vals.length<2) return `<svg class="spark" viewBox="0 0 80 24" aria-hidden="true"></svg>`;
  let mn = Math.min(...vals), mx = Math.max(...vals); if(mn===mx){ mn -= 1; mx += 1; }
  const p = vals.map((v,i) => [2+i*76/(vals.length-1), 21-(v-mn)/(mx-mn)*18]);
  const last = p[p.length-1];
  return `<svg class="spark" viewBox="0 0 80 24" aria-hidden="true"><polyline points="${p.map(q => q.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.8" fill="var(--accent)"/></svg>`;
}
function lineChart(vals, labels, o){
  o = o || {};
  const Wd = 340, Ht = 180, pl = 44, pr = 14, pt = 14, pb = 28, n = vals.length;
  const dmin = Math.min(...vals), dmax = Math.max(...vals);
  let mn = dmin, mx = dmax; if(mn===mx){ mn -= 1; mx += 1; } const pad = (mx-mn)*0.15; mn -= pad; mx += pad;
  const X = i => n===1 ? pl+(Wd-pl-pr)/2 : pl + i*(Wd-pl-pr)/(n-1);
  const Y = v => o.invert ? pt+(v-mn)/(mx-mn)*(Ht-pt-pb) : Ht-pb-(v-mn)/(mx-mn)*(Ht-pt-pb);
  const col = o.color || "var(--accent)";
  const ticks = dmin===dmax ? [dmin] : [dmin, dmax];
  let s = `<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${esc(o.label||"Verlauf")}">`;
  ticks.forEach(v => { const y = Y(v).toFixed(1); s += `<line x1="${pl}" x2="${Wd-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(o.fmt?o.fmt(v):fmt(v))}</text>`; });
  if(n>1){
    const pts = vals.map((v,i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const base = o.invert ? pt : Ht-pb;
    s += `<polygon points="${X(0).toFixed(1)},${base} ${pts} ${X(n-1).toFixed(1)},${base}" fill="${col}" opacity=".10"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  vals.forEach((v,i) => { s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?5:3}" fill="${i===n-1?col:"var(--surface)"}" stroke="${col}" stroke-width="2"/>`; });
  s += `<text x="${X(0).toFixed(1)}" y="${Ht-8}" text-anchor="${n===1?"middle":"start"}" font-size="11" fill="var(--muted)">${esc(labels[0])}</text>`;
  if(n>1) s += `<text x="${X(n-1).toFixed(1)}" y="${Ht-8}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(labels[n-1])}</text>`;
  return s + `</svg>`;
}

const HIP_IDS = ["hip","smithhip","dbhip","glutebridge"];
function facts(){
  const H = S.history, goal = S.settings.goal, weeks = {};
  let km = 0, vol = 0, early = false, hipMax = 0, prs = 0; const maxSoFar = {};
  let bestAlster = Infinity;
  H.forEach(e => {
    const wk = mondayOf(e.start); (weeks[wk] = weeks[wk] || {n:0, types:new Set()}).n++; weeks[wk].types.add(e.type);
    km += kmOf(e); vol += volOf(e);
    if(new Date(e.start).getHours()<8) early = true;
    Object.entries(e.sets||{}).forEach(([id,a]) => {
      const mk = Math.max(...a.map(s => num(s.kg)));
      if(maxSoFar[id]!=null && mk>maxSoFar[id]) prs++;
      maxSoFar[id] = Math.max(maxSoFar[id]||0, mk);
      if(HIP_IDS.includes(id)) hipMax = Math.max(hipMax, mk);
    });
    if(e.run && e.run.mode==="alster" && num(e.run.min)>0) bestAlster = Math.min(bestAlster, num(e.run.min));
  });
  const keys = Object.keys(weeks).map(Number).sort((a,b) => a-b);
  let streakMax = 0, cur = 0, prev = null;
  keys.forEach(k => { if(weeks[k].n>=goal){ cur = (prev!==null && k-prev<WEEK*1.5 && weeks[prev].n>=goal) ? cur+1 : 1; streakMax = Math.max(streakMax, cur); } prev = k; });
  return {total:H.length, km, vol, early, hipMax, prs, bestAlster, streakMax, yoga:H.filter(e => e.yoga).length,
    goalWeeks:keys.filter(k => weeks[k].n>=goal).length, allround:keys.some(k => ["po","lauf","oben"].every(t => weeks[k].types.has(t)))};
}

  const f = factsC(), id = b.id;
  const T = {first:[f.total,1],t10:[f.total,10],t25:[f.total,25],t50:[f.total,50],goal1:[f.goalWeeks,1],streak4:[f.streakMax,4," Wochen"],streak8:[f.streakMax,8," Wochen"],
    km10:[f.km,10," km"],km50:[f.km,50," km"],km100:[f.km,100," km"],ht50:[f.hipMax,50," kg"],ht80:[f.hipMax,80," kg"],pr5:[f.prs,5],pr20:[f.prs,20],vol10t:[f.vol/1000,10," t"],yoga1:[f.yoga,1],yoga10:[f.yoga,10]};
  if(id==="al45" || id==="al40"){
    const goal = id==="al45" ? 45 : 40, best = isFinite(f.bestAlster) ? f.bestAlster : 0;
    return best ? {pct:Math.min(1, goal/best), txt:`Bestzeit ${hms(best)}${best>goal?` · noch ${hms(best-goal)} schneller`:""}`} : {pct:0, txt:"Noch keine Alsterrunde mit Zeit"};
  }
  if(!T[id]) return {pct:0, txt:""};
  const [c, t, u] = T[id];
  return {pct:Math.min(1, Math.max(0, c/t)), txt:t>1 ? `${fmt(Math.min(c,t), u===" t"?1:0)} / ${t}${u||""}` : ""};
}

function recapData(y, m){ return rangeData(new Date(y, m, 1).getTime(), new Date(y, m+1, 1).getTime()); }
function rangeData(a, b){
  const inM = S.history.filter(e => e.start>=a && e.start<b), before = S.history.filter(e => e.start<a);
  const km = inM.reduce((x,e) => x+kmOf(e), 0), vol = inM.reduce((x,e) => x+volOf(e), 0);
  const days = new Set(inM.map(e => dkey(e.start))).size;
  const gains = [];
  const ids = new Set(); inM.forEach(e => Object.keys(e.sets||{}).forEach(k => ids.add(k)));
  ids.forEach(id => {
    const mx = arr => arr.reduce((x,e) => Math.max(x, ...((e.sets||{})[id]||[]).map(s => num(s.kg)), 0), 0);
    const pb = mx(before), pm = mx(inM);
    if(pb>0 && pm>pb) gains.push({n:EXN[id]?EXN[id].n:id, d:pm-pb, to:pm});
  });
  gains.sort((p,q) => q.d-p.d);
  const al = inM.filter(e => e.run && e.run.mode==="alster" && num(e.run.min)>0).map(e => num(e.run.min));
  const badges = BADGES.filter(x => S.badges && S.badges[x.id]>=a && S.badges[x.id]<b);
  const types = {}; inM.forEach(e => types[e.type] = (types[e.type]||0)+1);
  const kcal = inM.reduce((x,e) => x+kcalOf(e), 0);
  return {n:inM.length, km, vol, kcal, days, gains, bestAl: al.length?Math.min(...al):0, badges, types};
}
